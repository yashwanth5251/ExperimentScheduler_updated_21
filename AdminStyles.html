<style>
  /* ==========================================================================
     AdminStyles.html — Admin portal UI
     ========================================================================== */
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap');

  :root {
    --ink: #0c2e36;
    --ink-soft: #3d5c64;
    --teal: #147a80;
    --teal-deep: #0d5c61;
    --teal-glow: rgba(20, 122, 128, 0.18);
    --accent: #c97820;
    --surface: rgba(255, 255, 255, 0.9);
    --border: rgba(12, 46, 54, 0.12);
    --success-bg: #e8f8f0;
    --success-text: #0f6b45;
    --error-bg: #fff0f0;
    --error-text: #b42318;
    --warn-bg: #fff7eb;
    --warn-text: #8a5310;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 10px 30px rgba(12, 46, 54, 0.08);
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Outfit', system-ui, sans-serif;

    --color-primary: var(--teal);
    --color-primary-dark: var(--teal-deep);
    --color-bg: #eef6f7;
    --color-card: #ffffff;
    --color-border: var(--border);
    --color-text: var(--ink);
    --color-text-muted: var(--ink-soft);
    --color-success-bg: var(--success-bg);
    --color-success-text: var(--success-text);
    --color-error-bg: var(--error-bg);
    --color-error-text: var(--error-text);
    --color-warn-bg: var(--warn-bg);
    --color-warn-text: var(--warn-text);
    --color-navy: #0c2e36;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.5;
    background:
      radial-gradient(1000px 520px at 0% -5%, rgba(20, 122, 128, 0.18), transparent 55%),
      radial-gradient(800px 420px at 100% 0%, rgba(201, 120, 32, 0.10), transparent 50%),
      linear-gradient(180deg, #f3fafa 0%, #eef5f6 100%);
    background-attachment: fixed;
  }

  .admin-container {
    max-width: 1080px;
    margin: 0 auto;
    padding: clamp(20px, 3vw, 36px) clamp(14px, 2.5vw, 22px) 72px;
    animation: riseIn 0.45s ease both;
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .admin-header {
    text-align: center;
    margin-bottom: 22px;
  }

  .admin-header h1 {
    font-family: var(--font-display);
    font-size: clamp(1.6rem, 3.5vw, 2.1rem);
    margin: 0 0 6px;
    letter-spacing: -0.02em;
  }

  .subtitle {
    color: var(--ink-soft);
    margin: 0;
    font-size: 14px;
  }

  .brand-mark {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    color: var(--teal-deep);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .brand-mark::before {
    content: '';
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--teal), var(--teal-deep));
    box-shadow: 0 8px 16px var(--teal-glow);
  }

  .project-id-banner {
    background: linear-gradient(90deg, #0c2e36, #147a80);
    color: #fff;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 8px 12px;
  }
  .project-id-control {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
    font-size: 13px;
    flex-wrap: wrap;
  }
  .project-id-control label {
    color: var(--ink-soft);
    font-weight: 600;
  }
  .project-id-control input {
    width: min(240px, 70vw);
    padding: 8px 10px;
  }

  .owner-banner {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 16px;
    text-align: center;
    backdrop-filter: blur(8px);
  }

  .hidden { display: none !important; }

  .banner {
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    margin-bottom: 18px;
    font-size: 14px;
    font-weight: 500;
  }
  .banner-error {
    background: var(--error-bg);
    color: var(--error-text);
    border: 1px solid #f5c2c0;
  }
  .banner-success {
    background: var(--success-bg);
    color: var(--success-text);
    border: 1px solid #b7e4cb;
  }

  .concise-title { font-weight: 700; margin-bottom: 4px; }
  .concise-lines { margin: 0; padding-left: 18px; }
  .concise-lines li { margin: 1px 0; }
  .concise-details-btn {
    margin-top: 8px;
    background: none;
    border: none;
    color: var(--teal-deep);
    font-weight: 650;
    cursor: pointer;
    font-family: inherit;
    padding: 0;
  }

  .details-modal-body {
    font-size: 14px;
    line-height: 1.6;
    max-height: 50vh;
    overflow: auto;
  }

  .panel {
    background: var(--surface);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: clamp(16px, 2.5vw, 24px);
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }

  .panel h2, .panel h3 {
    font-family: var(--font-display);
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .panel h3 { font-size: 16px; }

  .panel-subtitle {
    color: var(--ink-soft);
    font-size: 13px;
    margin: 0 0 14px;
  }

  .hint {
    color: var(--ink-soft);
    font-size: 13px;
    margin: 0 0 12px;
  }

  .dashboard-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .dashboard-header h2 {
    font-family: var(--font-display);
    margin: 0;
    font-size: 1.35rem;
  }

  .dashboard-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .loading, .empty-message {
    color: var(--ink-soft);
    font-size: 14px;
    padding: 10px 0;
  }

  .empty-message {
    background: var(--warn-bg);
    border: 1px solid #f0d4a8;
    color: var(--warn-text);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
  }

  .table-scroll {
    width: 100%;
    overflow-x: auto;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: #fff;
  }

  .slot-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
    min-width: 640px;
  }

  .slot-table th, .slot-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: middle;
  }

  .slot-table th {
    background: rgba(20, 122, 128, 0.06);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    font-weight: 700;
  }

  .status-pill {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .status-available {
    background: var(--success-bg);
    color: var(--success-text);
  }
  .status-booked {
    background: #e8eef8;
    color: #274c77;
  }

  .ta-grid-nav { display: flex; gap: 8px; margin-bottom: 10px; }
  .ta-grid-scroll { overflow: auto; max-width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); background: #fff; }
  .ta-grid-table { border-collapse: collapse; font-size: 12.5px; }
  .ta-grid-table th, .ta-grid-table td {
    border: 1px solid var(--border);
    padding: 6px 8px;
    text-align: center;
  }
  .ta-grid-table thead th { background: rgba(20, 122, 128, 0.06); }
  .ta-grid-table .ta-grid-corner,
  .ta-grid-table .ta-grid-name-cell,
  .ta-grid-table .ta-grid-row-label {
    position: sticky;
    left: 0;
    background: #fff;
    z-index: 1;
    text-align: left;
  }
  .ta-grid-table thead .ta-grid-corner { z-index: 2; }
  .ta-grid-table .ta-grid-name-input {
    width: 140px;
    padding: 4px 6px;
    font-size: 12px;
  }
  .ta-grid-table .ta-grid-checkbox-cell input[type="checkbox"] { width: auto; }
  .ta-grid-table .ta-grid-submit-cell { white-space: nowrap; }
  .ta-grid-spacer-row td { background: #f7fafb; height: 8px; border: none; }
  .ta-grid-table .ta-grid-available { background: #e8f8f0; }
  .ta-grid-table .ta-grid-unavailable { background: #fff0f0; }
  .ta-grid-table .ta-grid-me-row .ta-grid-name-cell { font-weight: 700; }
  .ta-grid-table tfoot td { background: rgba(20, 122, 128, 0.04); font-weight: 650; }

  .subform {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .subform h4 {
    margin: 0 0 10px;
    font-size: 14px;
    font-family: var(--font-display);
  }

  .form-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
  }

  .filter-toolbar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 12px;
    padding: 12px;
    background: rgba(20, 122, 128, 0.04);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
  }
  .filter-toolbar .form-group { margin-bottom: 0; }
  .filter-toolbar label { font-size: 12px; }

  .form-group { margin-bottom: 14px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; }

  label {
    display: block;
    font-size: 12.5px;
    font-weight: 650;
    margin-bottom: 6px;
  }

  input[type="text"],
  input[type="date"],
  input[type="time"],
  input[type="number"],
  input[type="password"],
  input[type="email"],
  select,
  textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--ink);
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--teal);
    box-shadow: 0 0 0 4px var(--teal-glow);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: none;
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 13.5px;
    font-weight: 650;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.15s ease, background 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--teal), var(--teal-deep));
    color: #fff;
    box-shadow: 0 8px 20px var(--teal-glow);
  }
  .btn-primary:hover:not(:disabled) {
    transform: translateY(-1px);
  }

  .btn-secondary {
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--teal); }

  .btn-link {
    background: none;
    color: var(--teal-deep);
    padding: 4px 6px;
    text-decoration: underline;
  }
  .btn-link:hover { color: var(--teal); }

  .btn-danger {
    background: #c0392b;
    color: #fff;
  }
  .btn-danger:hover:not(:disabled) { background: #a93226; }

  .btn-sm, .btn-small {
    padding: 5px 12px;
    font-size: 12.5px;
    margin-right: 6px;
  }

  .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .row-actions-cell { white-space: nowrap; }
  .slot-table select { min-width: 120px; width: auto; }

  .day2-checkbox-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 6px;
    background: #fff;
  }
  .day2-checkbox-item input[type="checkbox"] { width: auto; margin-top: 3px; }

  .tag-warn {
    background: var(--warn-bg);
    color: var(--warn-text);
  }

  .warning-box {
    background: var(--warn-bg);
    border: 1px solid #f0d4a8;
    color: var(--warn-text);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-size: 13.5px;
    margin: 10px 0;
  }
  .warning-box ul { margin: 6px 0 0; padding-left: 18px; }
  .warning-box li { margin-bottom: 3px; }

  .day2-staff-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    padding: 8px 0;
  }
  .day2-staff-row select { min-width: 190px; width: auto; }
  .day2-staff-row input[type="checkbox"] { width: auto; }
  .day2-staff-row .slot-label { flex: 1 1 240px; }

  .compatible-box {
    background: rgba(20, 122, 128, 0.06);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    margin: 10px 0;
  }
  .compatible-box ul { margin: 6px 0 0; padding-left: 18px; }
  .compatible-box li { margin-bottom: 4px; }

  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255, 255, 255, 0.45);
    border-top-color: #fff;
    border-radius: 50%;
    display: inline-block;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .day2-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)) auto;
    gap: 10px;
    align-items: end;
    margin-bottom: 10px;
  }
  .day2-row > * { min-width: 0; }
  .day2-row .form-group { margin-bottom: 0; }
  .day2-row input,
  .day2-row select { width: 100%; }

  .tag {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    align-self: end;
    margin-bottom: 1px;
  }
  .tag-ok { background: var(--success-bg); color: var(--success-text); }
  .tag-bad { background: var(--error-bg); color: var(--error-text); }
  .tag-pending { background: #eef2f3; color: var(--ink-soft); }

  .row-remove-btn {
    background: none;
    border: none;
    color: var(--error-text);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 6px;
    align-self: end;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(12, 46, 54, 0.48);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
    box-sizing: border-box;
    animation: riseIn 0.2s ease both;
  }

  .modal {
    background: #fff;
    border-radius: var(--radius);
    padding: 24px;
    max-width: 420px;
    width: 100%;
    max-height: calc(100vh - 40px);
    overflow-y: auto;
    box-sizing: border-box;
    box-shadow: 0 24px 60px rgba(12, 46, 54, 0.28);
    border: 1px solid var(--border);
  }

  .modal-wide {
    max-width: min(720px, 96vw);
    max-height: calc(100vh - 40px);
    overflow-y: auto;
  }

  .modal-schedule {
    max-width: min(960px, 96vw);
    max-height: calc(100vh - 40px);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  #schedDay2ExistingList {
    max-height: 34vh;
    overflow-y: auto;
    padding-right: 4px;
  }
  #schedNewDay2RowsContainer {
    max-height: 40vh;
    overflow-y: auto;
    padding-right: 4px;
  }

  .modal-schedule .modal-actions {
    position: sticky;
    bottom: 0;
    background: #fff;
    padding-top: 12px;
    margin-top: 8px;
    border-top: 1px solid var(--border);
    z-index: 1;
  }

  .modal h3 {
    margin: 0 0 14px;
    font-size: 1.15rem;
    font-family: var(--font-display);
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 6px;
  }
  .modal-actions .btn { flex: 1; }

  .inline-row { display: flex; gap: 8px; align-items: center; }
  .inline-row input[type="date"] { flex: 1; }

  .avail-list { list-style: none; padding: 0; margin: 10px 0; }
  .avail-list li {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(20, 122, 128, 0.06); border-radius: 8px; padding: 8px 12px; margin-bottom: 6px;
    font-size: 14px;
  }
  .avail-list button {
    background: none; border: none; color: var(--error-text); cursor: pointer;
    font-size: 18px; line-height: 1;
  }

  .booking-pick-list { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
  .booking-pick-option {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
    cursor: pointer; font-size: 14px; background: #fff;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .booking-pick-option:hover { border-color: var(--teal); background: rgba(20, 122, 128, 0.04); }
  .booking-pick-option.current { border-color: #94a3b8; background: #f1f5f9; }
  .booking-pick-option.selected {
    border-color: var(--teal);
    background: rgba(20, 122, 128, 0.08);
    font-weight: 650;
    box-shadow: 0 0 0 3px var(--teal-glow);
  }

  a { color: var(--teal-deep); }

  @media (max-width: 720px) {
    .form-row { grid-template-columns: 1fr; }
    .day2-row { grid-template-columns: 1fr; }
    .row-remove-btn { justify-self: end; }
    .slot-table { font-size: 12.5px; }
    .modal { padding: 16px; max-height: calc(100vh - 24px); }
    .modal-schedule { padding: 16px; max-height: calc(100vh - 24px); }
    .modal-overlay { padding: 10px; }
    .dashboard-header { flex-direction: column; align-items: flex-start; gap: 10px; }
    .dashboard-actions { width: 100%; }
    .dashboard-actions .btn { flex: 1 1 auto; }
    .modal-actions { flex-wrap: wrap; }
    .modal-actions .btn { flex: 1 1 auto; }
    .banner { word-wrap: break-word; overflow-wrap: break-word; }
    #schedDay2ExistingList { max-height: 46vh; }
    #schedNewDay2RowsContainer { max-height: 52vh; }
    .project-id-control { flex-direction: column; }
  }

  /* Embedded in unified shell iframe */
  body.embed .project-id-banner { display: none !important; }
  body.embed .admin-container { padding-top: 18px; }
  body.embed #loginSection {
    max-width: 420px;
    margin-left: auto;
    margin-right: auto;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
