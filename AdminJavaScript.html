<script>
  /**
   * ==========================================================================
   *  AdminJavaScript.html — Client-side logic for the Admin portal
   * ==========================================================================
   *  NOTE ON PERMISSIONS: this file hides/shows controls based on the
   *  session's permission list, purely as a usability measure. It is NOT the
   *  security boundary — every mutating server function independently
   *  re-checks permissions via requirePermission_(), so nothing is trusted
   *  from here.
   * ==========================================================================
   */

  var MAPPING_MIN_HOURS = 22;
  var MAPPING_MAX_HOURS = 26;
  var DAY2_DEFAULT_DURATION = 60;
  var TIME_BEFORE_MRI_DEFAULT = 90;
  var MRI_DEFAULT_DURATION = 90;
  var COLLISION_CHECK_DEBOUNCE_MS = 350;

  var state = {
    token: null,
    session: null,          // {email, name, role, permissions}
    day1Slots: [],
    day2Slots: [],
    mriSlots: [],
    staffOptions: [],
    roleOptions: [],
    currentScheduleMri: null,
    currentDay1DateTime: null,
    day1Blocked: true, // round 5 fix: explicit block flag, set from the validator's actual errors
    // ---- Bulk Scheduling (round 3) ----
    bulkConfigMode: false,   // true while the shared scheduling dialog is being
                             // used to configure (not commit) a bulk entry
    bulkConfigs: {},         // mriSlotID -> collected createScheduleFromMri payload
    bulkCreatedMri: [],
    staffConflicts: [],
    mriWarningsAcknowledged: false,
    indepValidated: false,  // independent-Day2 candidate passed server check
    pendingReassign: null,      // deprecated round 12 — see pendingEditSchedule
    pendingEditSchedule: null,  // context object returned by getEditScheduleContext, for the open Edit Schedule modal
    pendingDeleteDay1: null,    // {slot, confirmOrphans} for the open Delete Day1 modal
    pendingDeleteDay2: null,    // slot for the open Delete Day2 modal
    pendingBookedAction: null,  // slot for the open Booked Slot Action modal
    bookings: [],
    currentBookingID: null,
    bookingNewDay1: null,        // null = keep current, or a {slotID,...} slot
    bookingNewDay2: null,        // null = keep current, or a {slotID,...} slot
    bookingCancelAvailability: []
  };

  var els = {};
  var ADMIN_SESSION_KEY_ = 'es_admin_session';
  var pendingShellSession_ = null;
  var adminUiReady_ = false;
  var adminSessionHandler_ = null;
  var adminLogoutHandler_ = null;

  function isEmbedded_() {
    try {
      return /(?:\?|&)embed=1(?:&|$)/.test(window.location.search) || window.parent !== window;
    } catch (e) {
      return false;
    }
  }

  function persistSessionToShell_() {
    if (!state.token || !state.session) return;
    var payload = {
      token: state.token,
      email: state.session.email,
      name: state.session.name,
      role: state.session.role,
      permissions: state.session.permissions || []
    };
    try { sessionStorage.setItem(ADMIN_SESSION_KEY_, JSON.stringify(payload)); } catch (e) { /* ignore */ }
    try {
      if (window.parent && window.parent !== window) {
        parent.postMessage({ type: 'es-admin-session', session: payload }, '*');
      }
    } catch (e2) { /* ignore */ }
  }

  function clearSessionFromShell_() {
    try { sessionStorage.removeItem(ADMIN_SESSION_KEY_); } catch (e) { /* ignore */ }
    try {
      if (window.parent && window.parent !== window) {
        parent.postMessage({ type: 'es-admin-logout' }, '*');
      }
    } catch (e2) { /* ignore */ }
  }

  // Buffer shell messages until DOMContentLoaded wires the real handlers.
  // (Most admin helpers live inside that callback and are not visible here.)
  window.addEventListener('message', function (evt) {
    var data = evt.data || {};
    if (data.type === 'es-admin-session' && data.session && data.session.token) {
      pendingShellSession_ = data.session;
      if (adminSessionHandler_) adminSessionHandler_(data.session);
    }
    if (data.type === 'es-admin-logout') {
      pendingShellSession_ = null;
      if (adminLogoutHandler_) adminLogoutHandler_();
    }
  });

  document.addEventListener('DOMContentLoaded', function () {
    cacheElements_();
    adminUiReady_ = true;

    function restoreShellSession_() {
      try {
        var raw = sessionStorage.getItem(ADMIN_SESSION_KEY_);
        if (!raw) return;
        var saved = JSON.parse(raw);
        if (!saved || !saved.token) return;
        applyExternalSession_(saved);
      } catch (e) { /* ignore */ }
    }

    function applyExternalSession_(saved) {
      if (!saved || !saved.token) return;
      var wasLoggedIn = !!state.token;
      state.token = saved.token;
      state.session = {
        email: saved.email,
        name: saved.name,
        role: saved.role,
        permissions: saved.permissions || []
      };
      try { sessionStorage.setItem(ADMIN_SESSION_KEY_, JSON.stringify(saved)); } catch (e) { /* ignore */ }
      if (els.sessionInfo) {
        els.sessionInfo.textContent = state.session.name + ' — ' + state.session.role;
      }
      hide_(els.loginSection);
      show_(els.dashboard);
      applyPermissionVisibility_();
      if (!wasLoggedIn) {
        loadStaffOptions_();
        loadOverview_();
        startAutoRefresh_();
      }
    }

    function handleShellLogout_() {
      stopAutoRefresh_();
      state.token = null;
      state.session = null;
      pendingShellSession_ = null;
      hide_(els.dashboard);
      if (!isEmbedded_()) show_(els.loginSection);
    }

    adminSessionHandler_ = applyExternalSession_;
    adminLogoutHandler_ = handleShellLogout_;

    if (isEmbedded_()) {
      // Parent shell owns login — hide the duplicate admin login panel.
      hide_(els.loginSection);
      document.body.classList.add('embed-admin');
      try { parent.postMessage({ type: 'es-request-session' }, '*'); } catch (e) { /* ignore */ }
    }
    if (pendingShellSession_) {
      applyExternalSession_(pendingShellSession_);
      pendingShellSession_ = null;
    } else {
      restoreShellSession_();
    }
    loadAdminContext_();
    loadProjectIdBanner_();

    els.loginForm.addEventListener('submit', onLogin_);
    els.refreshBtn.addEventListener('click', loadOverview_);
    els.logoutBtn.addEventListener('click', onLogout_);
    els.projectIdSaveBtn.addEventListener('click', onSaveProjectId_);

    if (els.overviewNavBtn) {
      els.overviewNavBtn.addEventListener('click', showOverviewWorkspace_);
    }
    if (els.assignmentsNavBtn) {
      els.assignmentsNavBtn.addEventListener('click', showAssignmentsView_);
    }
    if (els.adminSidebarToggle) {
      els.adminSidebarToggle.addEventListener('click', function () {
        var workspace = document.querySelector('.admin-workspace');
        if (workspace && workspace.classList.contains('sidebar-open')) closeMobileSidebar_();
        else openMobileSidebar_();

    if (els.adminSidebarBackdrop) {
      els.adminSidebarBackdrop.addEventListener('click', closeMobileSidebar_);

    if (els.assignmentsSearch) {
      els.assignmentsSearch.addEventListener('input', renderAssignmentsTable_);
    }
    if (els.assignmentsTypeFilter) {
      els.assignmentsTypeFilter.addEventListener('change', renderAssignmentsTable_);

    els.forgotPasswordLink.addEventListener('click', function (e) { e.preventDefault(); openForgotPassword_(); });

    els.fpBackBtn2.addEventListener('click', closeForgotPassword_);
    els.fpRequestBtn.addEventListener('click', onForgotPasswordRequest_);
    els.fpConfirmBtn.addEventListener('click', onForgotPasswordConfirm_);

    els.changePwBtn.addEventListener('click', function () {

    els.pwCancelBtn1.addEventListener('click', function () { closePwModal_(); showOverviewWorkspace_(); });
    els.pwCancelBtn2.addEventListener('click', function () { closePwModal_(); showOverviewWorkspace_(); });
    els.pwRequestBtn.addEventListener('click', onRequestPasswordChange_);
    els.pwConfirmBtn.addEventListener('click', onConfirmPasswordChange_);

    els.manageAdminsBtn.addEventListener('click', function () {
      openFeaturePanel_(els.adminsModalOverlay, openAdminsModal_, 'admins');
    });
    els.adminsCloseBtn.addEventListener('click', function () { returnFromFeaturePanel_(els.adminsModalOverlay); });
    els.createAdminBtn.addEventListener('click', onCreateAdmin_);

    els.bookingsBtn.addEventListener('click', function () {
      openFeaturePanel_(els.bookingsModalOverlay, openBookingsModal_, 'bookings');
    });
    els.bookingsCloseBtn.addEventListener('click', function () { returnFromFeaturePanel_(els.bookingsModalOverlay); });
    els.bookingRescheduleCancelBtn.addEventListener('click', function () { hide_(els.bookingRescheduleModalOverlay); });
    els.bookingRescheduleSaveBtn.addEventListener('click', onSaveBookingReschedule_);
    els.bookingCancelAddDateBtn.addEventListener('click', onAddBookingCancelDate_);
    els.bookingCancelBackBtn.addEventListener('click', function () { hide_(els.bookingCancelModalOverlay); });
    els.bookingCancelConfirmBtn.addEventListener('click', onConfirmBookingCancel_);

    els.deleteDay1CancelBtn.addEventListener('click', function () { hide_(els.deleteDay1ModalOverlay); });
    els.deleteDay1ConfirmBtn.addEventListener('click', onConfirmDeleteDay1_);

    els.deleteDay2CancelBtn.addEventListener('click', function () { hide_(els.deleteDay2ModalOverlay); });
    els.deleteDay2ConfirmBtn.addEventListener('click', onConfirmDeleteDay2_);

    els.bookedActionCancelBtn.addEventListener('click', function () { hide_(els.bookedActionModalOverlay); });
    els.bookedActionUnbookBtn.addEventListener('click', function () { onBookedAction_('unbook'); });
    els.bookedActionDeleteBtn.addEventListener('click', function () { onBookedAction_('delete'); });

    // Round 10: single-slot MRI creation removed — Bulk Scheduling
    // (bulkMriBtn / bulkMriModalOverlay) is now the only way to create MRI
    // slots, so every MRI slot goes through the same validation path and
    // can optionally be pushed straight into a schedule in the same step.

    // Round 10: single-slot independent Day 2 creation removed — Add Day 2
    // Slots (bulk-only, below) is now the only way to create them outside
    // the schedule builder.
    els.bulkDay2AddRowBtn.addEventListener('click', function () { addBulkDay2Row_(); });

    // ---- Schedule builder modal ----
    els.scheduleCancelBtn.addEventListener('click', closeScheduleModal_);
    els.scheduleSaveBtn.addEventListener('click', onSaveSchedule_);

      el.addEventListener('input', refreshScheduleDay1_);

    els.schedAddDay2RowBtn.addEventListener('click', function () { addSchedDay2Row_(); });

    // ---- Reassign staff modal ----
    els.editScheduleCancelBtn.addEventListener('click', function () { hide_(els.editScheduleModalOverlay); });
    els.editScheduleSaveBtn.addEventListener('click', onSaveEditSchedule_);

    // ---- 2026-08 requirements pass: new panels ----
    els.createBookingBtn.addEventListener('click', function () {

    els.bdBulkAddRowBtn.addEventListener('click', function () { addBulkBdRow_(); });
    els.bdBulkSaveBtn.addEventListener('click', onSaveBulkBd_);
    // taBdGridSubmitBtn is created dynamically inside renderTaBdGrid_ (the

    els.bdEditSaveBtn.addEventListener('click', onSaveEditBloodDrawing_);
    els.bdEditCancelBtn.addEventListener('click', function () { hide_(els.bdEditModalOverlay); });

    els.taAvailabilityBtn.addEventListener('click', function () {
      openFeaturePanel_(els.taAvailModalOverlay, openTAAvailabilityModal_, 'taAvailability');

    els.taAvailCloseBtn.addEventListener('click', function () { returnFromFeaturePanel_(els.taAvailModalOverlay); });
    els.taAvailSaveBtn.addEventListener('click', onSaveTAAvailability_);

    els.manageRolesBtn.addEventListener('click', function () {
      openFeaturePanel_(els.manageRolesModalOverlay, openManageRolesModal_, 'roles');
    });
    els.rolesCloseBtn.addEventListener('click', function () { returnFromFeaturePanel_(els.manageRolesModalOverlay); });
    els.createRoleBtn.addEventListener('click', onCreateRole_);
    els.createTaskBtn.addEventListener('click', onCreateTask_);

    els.postExpBtn.addEventListener('click', function () {
      openFeaturePanel_(els.postExpModalOverlay, openPostExpModal_, 'postExp');
    });
    els.postExpCloseBtn.addEventListener('click', function () { returnFromFeaturePanel_(els.postExpModalOverlay); });

    els.combinationsBtn.addEventListener('click', function () {
      openFeaturePanel_(els.combinationsModalOverlay, openCombinationsModal_, 'combinations');
    });
    els.addSchedTypeBtn.addEventListener('click', onAddSchedulingType_);
    els.recordsBtn.addEventListener('click', function () {
      openFeaturePanel_(els.recordsModalOverlay, openRecordsModal_, 'records');
    });
    els.emailTemplatesBtn.addEventListener('click', function () {
      openFeaturePanel_(els.emailTemplatesModalOverlay, openEmailTemplatesModal_, 'emailTemplates');
    });
    els.emailTemplatesCloseBtn.addEventListener('click', function () { returnFromFeaturePanel_(els.emailTemplatesModalOverlay); });
    els.etTemplateSelect.addEventListener('change', renderSelectedEmailTemplate_);
    els.etSaveBtn.addEventListener('click', onSaveEmailTemplate_);
    els.etResetBtn.addEventListener('click', onResetEmailTemplate_);
    els.calendarInvitesBtn.addEventListener('click', function () {
      openFeaturePanel_(els.calendarInvitesModalOverlay, openCalendarInvitesModal_, 'calendarInvites');
    });
    els.calendarInvitesCloseBtn.addEventListener('click', function () { returnFromFeaturePanel_(els.calendarInvitesModalOverlay); });
    els.recordsCloseBtn.addEventListener('click', function () { returnFromFeaturePanel_(els.recordsModalOverlay); });
    els.detailsModalCloseBtn.addEventListener('click', function () { hide_(els.detailsModalOverlay); });
    els.recordsRefreshBtn.addEventListener('click', loadRecords_);
    // Round 11: apply live instead of requiring a Load click after changing scope/type.
    els.recordsScopeSelect.addEventListener('change', loadRecords_);
    els.recordsSheetSelect.addEventListener('change', loadRecords_);
    els.combinationsCloseBtn.addEventListener('click', function () { returnFromFeaturePanel_(els.combinationsModalOverlay); });
    els.combinationsRefreshBtn.addEventListener('click', loadCombinations_);
    // Round 11: apply live instead of requiring a Preview click after changing scope.
    els.combinationsScope.addEventListener('change', loadCombinations_);
    els.combinationsPdfBtn.addEventListener('click', onExportCombinationsPdf_);
    els.combinationsFilter.addEventListener('input', renderCombinationsRows_);

    els.bulkMriBtn.addEventListener('click', function () {
      openFeaturePanel_(els.bulkMriModalOverlay, openBulkMriModal_, 'bulkMri');
    });
    els.bulkMriAddRowBtn.addEventListener('click', function () { addBulkMriRow_(); });
    els.bulkMriValidateBtn.addEventListener('click', onValidateBulkMri_);
    els.bulkMriSaveBtn.addEventListener('click', onSaveBulkMri_);
    els.bulkMriPushBtn.addEventListener('click', onPushBulkMriToSchedule_);
    els.bulkMriCloseBtn.addEventListener('click', function () { returnFromFeaturePanel_(els.bulkMriModalOverlay); });

    // Round 12 fix: everything from cacheElements_() onward used to sit
    // OUTSIDE this callback (the closing '});' was here). Any top-level
    // code added in later rounds that runs immediately rather than only
    // declaring a function — like the Day 1/Day 2/MRI filter-toolbar
    // listeners, the Blood Drawing and Day 2 bulk-row buttons, the Project
    // ID save button, and the Edit Slot Cancel/Save buttons — executed at
    // SCRIPT LOAD time, before cacheElements_() had ever run, so `els` was
    // still empty and every one of those .addEventListener calls threw
    // immediately. Because a thrown error stops the rest of that top-level
    // script execution, everything textually after the FIRST such call
    // (the Day 1 filter toolbar) silently never ran — which is exactly why
    // Edit Slot's Cancel/Save (and a number of other things added since)
    // appeared "not wired up". Moving the closing brace down to the end of
    // the file brings all of it inside this callback, so it only runs once
    // cacheElements_() has actually populated `els`.

  function cacheElements_() {
    var ids = [
      'ownerBanner', 'adminMessageBanner', 'adminMessageTitle', 'adminMessageLines', 'adminMessageDetailsBtn',
      'projectIdBanner', 'projectIdControl', 'projectIdInput', 'projectIdSaveBtn', 'projectIdSavedTag',
      'detailsModalOverlay', 'detailsModalTitle', 'detailsModalBody', 'detailsModalCloseBtn',
      'loginSection', 'loginForm', 'adminEmail', 'adminPassword', 'loginBtn', 'loginBtnText', 'loginSpinner',
      'forgotPasswordLink', 'fpSection', 'fpStep1', 'fpStep2', 'fpEmail',
      'fpRequestBtn', 'fpRequestBtnText', 'fpRequestSpinner', 'fpBackBtn1',
      'fpOtp', 'fpOtpHint', 'fpNewPassword', 'fpConfirmPassword',
      'fpConfirmBtn', 'fpConfirmBtnText', 'fpConfirmSpinner', 'fpBackBtn2',
      'dashboard', 'sessionInfo', 'refreshBtn', 'changePwBtn', 'manageAdminsBtn', 'logoutBtn',
      'adminSidebar', 'adminSidebarToggle', 'adminSidebarBackdrop', 'adminViewTitle',

      'bookingsBtn', 'bookingsModalOverlay', 'bookingsModalError', 'bookingsModalSuccess',
      'bookingsLoading', 'bookingsEmptyMsg', 'bookingsTable', 'bookingsTableBody', 'bookingsCloseBtn',
      'bookingRescheduleModalOverlay', 'bookingRescheduleModalText', 'bookingRescheduleModalError',
      'bookingDay1Loading', 'bookingDay1Options', 'bookingDay2Loading', 'bookingDay2Options',
      'bookingRescheduleCancelBtn', 'bookingRescheduleSaveBtn', 'bookingRescheduleSaveBtnText', 'bookingRescheduleSpinner',
      'bookingCancelModalOverlay', 'bookingCancelModalText', 'bookingCancelModalError',
      'bookingCancelAvailDate', 'bookingCancelAddDateBtn', 'bookingCancelAvailList', 'bookingCancelDontKnow',
      'bookingCancelBackBtn', 'bookingCancelConfirmBtn', 'bookingCancelConfirmBtnText', 'bookingCancelSpinner',
      'day1OverviewLoading', 'day1EmptyMsg', 'day1Table', 'day1TableBody',
      'day1Search', 'day1StatusFilter', 'day1SortBy', 'day1SortDir',
      'day2OverviewLoading', 'day2EmptyMsg', 'day2Table', 'day2TableBody',
      'day2Search', 'day2StatusFilter', 'day2SortBy', 'day2SortDir',
      'mriOverviewLoading', 'mriEmptyMsg', 'mriTable', 'mriTableBody',
      'mriSearch', 'mriStatusFilter', 'mriSortBy', 'mriSortDir',

      'bulkDay2Error', 'bulkDay2Success', 'bulkDay2Table', 'bulkDay2TableBody', 'bulkDay2AddRowBtn', 'bulkDay2SaveBtn',
      'pwModalOverlay', 'pwModalError', 'pwStep1', 'pwStep2', 'pwCurrent', 'pwNew', 'pwConfirm',
      'pwOtp', 'pwOtpHint', 'pwCancelBtn1', 'pwCancelBtn2', 'pwRequestBtn', 'pwConfirmBtn',
      'adminsModalOverlay', 'adminsModalError', 'adminsModalSuccess', 'adminsLoading',
      'adminsTable', 'adminsTableBody', 'newAdminName', 'newAdminEmail', 'newAdminRole',
      'newAdminPassword', 'createAdminBtn', 'adminsCloseBtn',
      'deleteDay1ModalOverlay', 'deleteDay1ModalText', 'deleteDay1OrphanList',
      'deleteDay1CancelBtn', 'deleteDay1ConfirmBtn',
      'deleteDay2ModalOverlay', 'deleteDay2ModalText', 'deleteDay2CancelBtn', 'deleteDay2ConfirmBtn',
      'bookedActionModalOverlay', 'bookedActionModalText', 'bookedActionCancelBtn',
      'bookedActionUnbookBtn', 'bookedActionDeleteBtn',
      'scheduleModalOverlay', 'scheduleModalMriText', 'scheduleModalError',
      'schedTimeBeforeMri', 'schedMriDuration', 'schedDay1DateDisplay', 'schedDay1StartDisplay',
      'schedDay1EndDisplay', 'schedMriResizeMsg', 'schedDay1CollisionMsg', 'schedDay1StaffSelect', 'schedLanguageSelect',
      'schedDay2Loading', 'schedDay2EmptyMsg', 'schedDay2ExistingList', 'schedAddDay2RowBtn',
      'schedNewDay2RowsContainer', 'schedStaffConflictBox', 'schedMriOverlapBox', 'schedMriOverlapList',
      'scheduleCancelBtn', 'scheduleSaveBtn', 'scheduleSaveBtnText', 'scheduleSaveSpinner',
      'editScheduleModalOverlay', 'editScheduleModalText', 'editScheduleError',
      'editScheduleDay1Section', 'editScheduleDay1Text', 'editScheduleDay1Staff', 'editScheduleDay1Language',
      'editScheduleDay2Section', 'editScheduleDay2Text', 'editScheduleDay2Staff', 'editScheduleDay2Language',
      'editScheduleDay2TimeFields', 'editScheduleDay2Date', 'editScheduleDay2Start', 'editScheduleDay2Duration',
      'editScheduleBdSection', 'editScheduleBdText', 'editScheduleBdStaff', 'editScheduleBdTA',
      'editScheduleCancelBtn', 'editScheduleSaveBtn',
      // (reassignCancelBtn/reassignConfirmBtn removed round 12 — see editScheduleCancelBtn/editScheduleSaveBtn)
      // (editSlotModalOverlay and friends removed round 15, #3 — absorbed into Edit Schedule above)
      // ---- 2026-08 requirements pass: new panels ----
      'createBookingBtn', 'createBookingModalOverlay', 'createBookingError', 'createBookingSuccess',
      'cbDay1Select', 'cbDay2Select', 'cbTitleSelect', 'cbGenderSelect', 'cbLanguageSelect', 'cbFirstName', 'cbLastName', 'cbEmail', 'cbComments',
      'cbCancelBtn', 'cbSaveBtn', 'cbSaveBtnText', 'cbSaveSpinner',
      'bloodDrawingBtn', 'bloodDrawingModalOverlay', 'bdError', 'bdSuccess',

      'mriPushSelectedBtn'

    ids.forEach(function (id) { els[id] = document.getElementById(id); });
  }

  // ---------------------------------------------------------------------
  // Permission helpers
  // ---------------------------------------------------------------------

  function can_(permission) {
    return !!(state.session && state.session.permissions && state.session.permissions.indexOf(permission) !== -1);
  }

  var ADMIN_PANEL_OVERLAYS_ = [
    'bookingsModalOverlay', 'createBookingModalOverlay', 'bloodDrawingModalOverlay',
    'taAvailModalOverlay', 'manageRolesModalOverlay', 'postExpModalOverlay',
    'bulkMriModalOverlay', 'combinationsModalOverlay', 'recordsModalOverlay',
    'emailTemplatesModalOverlay', 'calendarInvitesModalOverlay', 'adminsModalOverlay',
    'pwModalOverlay'
  ];

  var ADMIN_VIEW_TITLES_ = {
    overview: 'Sessions & Slots',
    assignments: 'Assignments',
    bookings: 'Bookings & Reschedule',
    createBooking: 'Create Booking',
    bloodDrawing: 'Blood Drawing',
    taAvailability: 'TA Availability',
    admins: 'Users & Admins',
    roles: 'Roles & Permissions',
    records: 'Records & History',
    postExp: 'Post-Experiment',
    combinations: 'Schedule Combinations',
    bulkMri: 'Add MRI Slots',
    emailTemplates: 'Email Templates',
    calendarInvites: 'Calendar Invitations',
    password: 'Change Password'

  function setActiveNav_(view) {
    document.querySelectorAll('.admin-nav-item').forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-admin-view') === view);
    });
    if (els.adminViewTitle) {
      els.adminViewTitle.textContent = ADMIN_VIEW_TITLES_[view] || 'Admin';
    }
  }

  function closeSidebarPanels_() {
    ADMIN_PANEL_OVERLAYS_.forEach(function (id) {
      var el = els[id];
      if (!el) return;

  function renderAssignmentsTable_() {
    if (!els.assignmentsTableBody) return;
    var q = ((els.assignmentsSearch && els.assignmentsSearch.value) || '').trim().toLowerCase();
    var typeFilter = (els.assignmentsTypeFilter && els.assignmentsTypeFilter.value) || '';
    var rows = [];

    (state.day1Slots || []).forEach(function (s) {
      var staff = s.assignedStaffName || s.assignedStaffEmail || '';
      if (!staff) return;
      rows.push({
        type: 'DAY1',
        slotID: s.slotID,
        date: s.date || '',
        time: (s.startTime || s.start || '') + (s.endTime || s.end ? ' – ' + (s.endTime || s.end) : ''),
        assigned: staff,
        status: s.status || '',
        slot: s,
        kind: 'day1'
      });
    });
    (state.day2Slots || []).forEach(function (s) {
      var staff = s.assignedStaffName || s.assignedStaffEmail || '';
      if (!staff) return;
      rows.push({
        type: 'DAY2',
        slotID: s.slotID,
        date: s.date || '',
        time: (s.startTime || s.start || '') + (s.endTime || s.end ? ' – ' + (s.endTime || s.end) : ''),
        assigned: staff,
        status: s.status || '',
        slot: s,
        kind: 'day2'
      });
    });
    (state.mriSlots || []).forEach(function (s) {
      var staff = [s.day1StaffName, s.day2StaffName].filter(Boolean).join(' / ');
      if (!staff) return;
      rows.push({
        type: 'MRI',
        slotID: s.slotID,
        date: s.date || '',
        time: (s.startTime || s.start || '') + (s.duration ? ' (' + s.duration + ' min)' : ''),
        assigned: staff,
        status: s.status || '',
        slot: s,
        kind: 'mri'
      });
    });

    rows = rows.filter(function (r) {
      if (typeFilter && r.type !== typeFilter) return false;
      if (!q) return true;
      return (r.slotID + ' ' + r.date + ' ' + r.assigned + ' ' + r.type).toLowerCase().indexOf(q) !== -1;
    });
    rows.sort(function (a, b) {
      return String(a.date).localeCompare(String(b.date)) || String(a.time).localeCompare(String(b.time));
    });

    els.assignmentsTableBody.innerHTML = '';
    if (!rows.length) {
      show_(els.assignmentsEmptyMsg);
      return;
    }
    hide_(els.assignmentsEmptyMsg);
    rows.forEach(function (r) {
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + escapeHtml_(r.type) + '</td>' +
        '<td>' + escapeHtml_(r.slotID) + '</td>' +
        '<td>' + escapeHtml_(r.date) + '</td>' +
        '<td>' + escapeHtml_(r.time) + '</td>' +
        '<td>' + escapeHtml_(r.assigned) + '</td>' +
        '<td><span class="status-pill">' + escapeHtml_(r.status || '—') + '</span></td>' +
        '<td></td>';
      var td = tr.lastElementChild;
      if (r.kind === 'day1' || r.kind === 'day2') {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn btn-secondary btn-small';
        btn.textContent = 'Edit';
        btn.addEventListener('click', function () {
          openEditScheduleModal_(r.slot, r.kind);
        });
        td.appendChild(btn);
      } else {
        td.textContent = '—';
      }
      els.assignmentsTableBody.appendChild(tr);
    });
  }

  function escapeHtml_(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function onLogin_(evt) {
    evt.preventDefault();
    clearMessage_();
    var email = els.adminEmail.value.trim();
    var password = els.adminPassword.value;
    if (!email || !password) {
      showError_('Please enter your email and password.');
      return;
    }

    setLoginBusy_(true);
    google.script.run
      .withSuccessHandler(function (result) {
        setLoginBusy_(false);
        if (result && result.success) {
          state.token = result.token;
          state.session = {
            email: result.email,
            name: result.name,
            role: result.role,
            permissions: result.permissions || []
          };
          persistSessionToShell_();
          els.adminPassword.value = '';
          els.sessionInfo.textContent = state.session.name + ' — ' + state.session.role;
          hide_(els.loginSection);
          show_(els.dashboard);
          applyPermissionVisibility_();
          loadStaffOptions_();
          loadOverview_();
          startAutoRefresh_();
        } else {
          showError_((result && result.message) || 'Login failed.');
        }
      })
      .withFailureHandler(function (err) {
        setLoginBusy_(false);
        showError_('Unexpected error: ' + errorText_(err));
      })
      .adminLogin(email, password);
  }

  function setLoginBusy_(busy) {
    els.loginBtn.disabled = busy;
    if (busy) {
      show_(els.loginSpinner);

      hide_(els.loginSpinner);

  function onLogout_() {
    var token = state.token;
    stopAutoRefresh_();
    state.token = null;
    state.session = null;
    clearSessionFromShell_();
    hide_(els.dashboard);
    show_(els.loginSection);
    clearMessage_();
    if (token) {
      google.script.run.withFailureHandler(function () {}).adminLogout(token);
    }

  function handleSessionExpired_() {
    stopAutoRefresh_();
    state.token = null;
    state.session = null;
    clearSessionFromShell_();
    hide_(els.dashboard);
    show_(els.loginSection);
    showError_('Your admin session has expired. Please log in again.');
  }

  function isSessionError_(err) {
    var text = errorText_(err).toLowerCase();
    return text.indexOf('session') !== -1 || text.indexOf('not signed in') !== -1;

  // ---------------------------------------------------------------------
  // Round 7: Session Language dropdowns (shared by the MRI schedule
  // builder, independent Day 2 creation, and the Admin Booking Portal).
  // ---------------------------------------------------------------------
  function fillLanguageSelect_(select, options, currentValue, defaultToAny) {
    if (!select) return;
    select.innerHTML = '';
    options.forEach(function (l) {
      var opt = document.createElement('option');
      opt.value = l.key;
      opt.textContent = l.label;
      select.appendChild(opt);
    });
    if (currentValue) {
      select.value = currentValue;
    } else if (defaultToAny) {
      select.value = 'any';
    }
  }

  function populateLanguageSelect_(select, currentValue, defaultToAny) {
    if (!select) return;
    if (state.languageOptions) {
      fillLanguageSelect_(select, state.languageOptions, currentValue, defaultToAny !== false);
      return;
    }
    google.script.run
      .withSuccessHandler(function (options) {
        state.languageOptions = options || [{ key: 'any', label: 'Any / No preference' }];
        fillLanguageSelect_(select, state.languageOptions, currentValue, defaultToAny !== false);
      })
      .withFailureHandler(function () {
        // Leave whatever static fallback option is already in the markup.
      })
      .getSlotLanguageOptions();

  // ---------------------------------------------------------------------
  // Slot overview
  // ---------------------------------------------------------------------

  // ---------------------------------------------------------------------
  // Round 9: background auto-refresh. Search/filter/sort already apply
  // live as you type (no button needed) — this additionally re-fetches
  // the underlying slot data periodically, so slots created/changed by
  // OTHER admins appear without a manual page reload. Silent (no loading
  // spinners) so it doesn't interrupt whatever the admin is doing, and it
  // re-applies whatever search/filter/sort is currently set, via the same
  // refresh*TableView_ functions used for manual filtering. Skipped
  // entirely while any modal is open, so it can never overwrite an
  // in-progress edit out from under the admin.
  var AUTO_REFRESH_INTERVAL_MS = 30000;
  var autoRefreshTimer = null;

  function anyModalOpen_() {
    var overlays = document.querySelectorAll('.modal-overlay');
    for (var i = 0; i < overlays.length; i++) {
      var el = overlays[i];
      if (el.classList.contains('as-panel')) continue; // sidebar feature panels are fine to refresh under
      if (!el.classList.contains('hidden')) return true;
    }
    return false;
  }

  function startAutoRefresh_() {
    stopAutoRefresh_();
    autoRefreshTimer = setInterval(function () {
      if (!state.token || anyModalOpen_()) return;
      loadOverviewSilent_();
      if (typeof loadBloodDrawingSlotsSilent_ === 'function') loadBloodDrawingSlotsSilent_();
    }, AUTO_REFRESH_INTERVAL_MS);
  }

  function stopAutoRefresh_() {
    if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
  }

  function loadOverviewSilent_() {
    google.script.run
      .withSuccessHandler(function (data) {
        state.day1Slots = data.day1 || [];
        state.day2Slots = data.day2 || [];
        state.mriSlots = data.mri || [];
        refreshDay1TableView_();
        refreshDay2TableView_();
        refreshMriTableView_();
        if (els.adminViewAssignments && !els.adminViewAssignments.classList.contains('hidden')) {
          renderAssignmentsTable_();
        }
      })
      .withFailureHandler(function (err) {
        // Silent by design — a background refresh failing shouldn't
        // interrupt the admin with an error banner. Session expiry is the
        // one case worth acting on.
        if (isSessionError_(err)) { stopAutoRefresh_(); handleSessionExpired_(); }
      })
      .getAdminSlotsOverview(state.token);
  }

  function loadOverview_() {
    [els.day1OverviewLoading, els.day2OverviewLoading, els.mriOverviewLoading].forEach(show_);
    [els.day1Table, els.day2Table, els.mriTable, els.day1EmptyMsg, els.day2EmptyMsg, els.mriEmptyMsg].forEach(hide_);

    google.script.run
      .withSuccessHandler(function (data) {
        [els.day1OverviewLoading, els.day2OverviewLoading, els.mriOverviewLoading].forEach(hide_);
        state.day1Slots = data.day1 || [];
        state.day2Slots = data.day2 || [];
        state.mriSlots = data.mri || [];
        refreshDay1TableView_();
        refreshDay2TableView_();
        refreshMriTableView_();
        if (els.adminViewAssignments && !els.adminViewAssignments.classList.contains('hidden')) {
          renderAssignmentsTable_();
        }
      })
      .withFailureHandler(function (err) {
        [els.day1OverviewLoading, els.day2OverviewLoading, els.mriOverviewLoading].forEach(hide_);
        if (isSessionError_(err)) { handleSessionExpired_(); return; }
        showError_('Could not load slot overview: ' + errorText_(err));
      })
      .getAdminSlotsOverview(state.token);
  }

  // ---------------------------------------------------------------------
  // Round 8: search/filter/sort toolbars for the Day 1, Day 2, MRI, and
  // Blood Drawing overview tables. Purely client-side (the full slot list
  // for each table is already in state.*Slots) — filters and re-sorts,
  // then re-runs the table's existing render function on the result. This
  // never mutates state.*Slots itself, so "no filter applied" always shows
  // the full list again.
  // ---------------------------------------------------------------------
  function filterSortSlots_(slots, searchText, statusFilter, sortBy, sortDir, searchFields) {
    var q = String(searchText || '').trim().toLowerCase();
    var filtered = (slots || []).filter(function (s) {
      if (statusFilter === 'available' && s.booked) return false;
      if (statusFilter === 'booked' && !s.booked) return false;
      if (!q) return true;
      return searchFields.some(function (f) {
        return String(s[f] || '').toLowerCase().indexOf(q) !== -1;
      });
    });
    filtered.sort(function (a, b) {
      var av, bv;
      if (sortBy === 'date') {
        av = a.startMs || 0; bv = b.startMs || 0;
      } else {
        av = String(a[sortBy] || '').toLowerCase();
        bv = String(b[sortBy] || '').toLowerCase();
      }
      if (av < bv) return sortDir === 'desc' ? 1 : -1;
      if (av > bv) return sortDir === 'desc' ? -1 : 1;
      return 0;
    });
    return filtered;
  }

  function refreshDay1TableView_() {
    renderDay1Table_(filterSortSlots_(
      state.day1Slots, els.day1Search.value, els.day1StatusFilter.value,
      els.day1SortBy.value, els.day1SortDir.value,
      ['slotID', 'assignedStaffName', 'assignedStaff', 'date', 'creatorName', 'mriSlotID', 'language']
    ));
  }

  function refreshDay2TableView_() {
    renderDay2Table_(filterSortSlots_(
      state.day2Slots, els.day2Search.value, els.day2StatusFilter.value,
      els.day2SortBy.value, els.day2SortDir.value,
      ['slotID', 'assignedStaffName', 'assignedStaff', 'date', 'creatorName', 'language']
    ));
  }

  function refreshMriTableView_() {
    renderMriTable_(filterSortSlots_(
      state.mriSlots, els.mriSearch.value, els.mriStatusFilter.value,
      els.mriSortBy.value, els.mriSortDir.value,
      ['slotID', 'day1StaffName', 'day2StaffName', 'day1Staff', 'day2Staff', 'date', 'createdBy']
    ));
  }

  [
    ['day1Search', 'input'], ['day1StatusFilter', 'change'], ['day1SortBy', 'change'], ['day1SortDir', 'change']
  ].forEach(function (pair) { els[pair[0]].addEventListener(pair[1], refreshDay1TableView_); });
  [
    ['day2Search', 'input'], ['day2StatusFilter', 'change'], ['day2SortBy', 'change'], ['day2SortDir', 'change']
  ].forEach(function (pair) { els[pair[0]].addEventListener(pair[1], refreshDay2TableView_); });
  [
    ['mriSearch', 'input'], ['mriStatusFilter', 'change'], ['mriSortBy', 'change'], ['mriSortDir', 'change']
  ].forEach(function (pair) { els[pair[0]].addEventListener(pair[1], refreshMriTableView_); });

  function renderDay1Table_(slots) {
    els.day1TableBody.innerHTML = '';

        tr.appendChild(cell_(v));

      tr.appendChild(statusCell_(slot.booked));

      var actionTd = document.createElement('td');
      actionTd.className = 'row-actions-cell';
      if (can_('manage_slots')) {
        actionTd.appendChild(smallBtn_('Edit Schedule', function () { openEditScheduleModal_(slot, 'day1'); }, true));
        actionTd.appendChild(smallBtn_(slot.booked ? 'Manage' : 'Delete', function () {
          if (slot.booked) { openBookedActionModal_(slot); } else { openDeleteDay1Modal_(slot); }
        }, false));
      }
      tr.appendChild(actionTd);
      els.day1TableBody.appendChild(tr);
    });

    show_(els.day1Table);
  }

  function renderDay2Table_(slots) {
    els.day2TableBody.innerHTML = '';
    if (!slots || slots.length === 0) {
      show_(els.day2EmptyMsg);
      hide_(els.day2Table);
      return;
    }

    slots.forEach(function (slot) {

       slot.assignedStaffName || '\u2014', languageLabel_(slot.language), slot.creatorName || '\u2014'].forEach(function (v) {
        tr.appendChild(cell_(v));
      });
      tr.appendChild(statusCell_(slot.booked));

      var actionTd = document.createElement('td');
      actionTd.className = 'row-actions-cell';
      if (can_('manage_slots')) {
        actionTd.appendChild(smallBtn_('Edit Schedule', function () { openEditScheduleModal_(slot, 'day2'); }, true));
        if (!slot.booked) {
          actionTd.appendChild(smallBtn_('Delete', function () { openDeleteDay2Modal_(slot); }, false));
        } else {
          var note = document.createElement('span');

  function renderMriTable_(slots) {
    els.mriTableBody.innerHTML = '';
    if (!slots || slots.length === 0) {
      show_(els.mriEmptyMsg);
      hide_(els.mriTable);
      refreshMriPushSelectedButton_();

    }
    hide_(els.mriEmptyMsg);

    slots.forEach(function (slot) {
      var tr = document.createElement('tr');

      var checkTd = document.createElement('td');
      checkTd.className = 'manage-slots-only';
      if (!slot.booked && can_('manage_slots')) {
        var checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'mri-push-select';
        checkbox.dataset.slotId = slot.slotID;
        checkbox.addEventListener('change', refreshMriPushSelectedButton_);
        checkTd.appendChild(checkbox);
      }
      tr.appendChild(checkTd);

      [slot.slotID, slot.date, slot.startTime,
       (slot.durationMinutes ? slot.durationMinutes + ' min' : '\u2014'),
       slot.endTime,
       slot.day1StaffName || '\u2014',
       slot.day2StaffName || '\u2014',
       slot.createdBy || '\u2014'].forEach(function (v) {
        tr.appendChild(cell_(v));
      });
      tr.appendChild(statusCell_(slot.booked));

      var actionTd = document.createElement('td');
      actionTd.className = 'row-actions-cell';
      if (!slot.booked && can_('manage_slots')) {
        actionTd.appendChild(smallBtn_('Add to Schedule', function () {
          openScheduleModal_(slot);
        }, true, 'btn-primary'));
        actionTd.appendChild(smallBtn_('Delete', function () { onDeleteMriSlot_(slot); }, false));
      } else if (slot.booked) {
        var note = document.createElement('span');
        note.className = 'panel-subtitle';
        note.textContent = 'Used in schedule';
        actionTd.appendChild(note);
      }
      tr.appendChild(actionTd);
      els.mriTableBody.appendChild(tr);
    });

    show_(els.mriTable);
    refreshMriPushSelectedButton_();
  }

        setFpConfirmBusy_(false);
        showError_('Unexpected error: ' + errorText_(err));

  // ---- Reschedule ----

  function showBookingRescheduleError_(text) {
    els.bookingRescheduleModalError.textContent = text;
    show_(els.bookingRescheduleModalError);
  }

  function openBookingRescheduleModal_(booking) {
    state.currentBookingID = booking.bookingID;
    state.bookingNewDay1 = null; // null = keep current
    state.bookingNewDay2 = null; // null = keep current
    hide_(els.bookingRescheduleModalError);
    els.bookingRescheduleModalText.textContent =
      'Booking ' + booking.bookingID + ' \u2014 ' + booking.name + ' (' + booking.email + ')';
    els.bookingDay1Options.innerHTML = '';
    els.bookingDay2Options.innerHTML = '';
    show_(els.bookingDay1Loading);
    hide_(els.bookingDay2Loading);
    show_(els.bookingRescheduleModalOverlay);

    google.script.run
      .withSuccessHandler(function (res) {
        hide_(els.bookingDay1Loading);
        if (!res || !res.success) { showBookingRescheduleError_((res && res.message) || 'Could not load options.'); return; }
        renderBookingDay1Options_(booking, res.slots || []);
        loadBookingDay2Options_(booking, null); // null day1 = keep current
      })
      .withFailureHandler(function (err) {
        hide_(els.bookingDay1Loading);
        showBookingRescheduleError_(errorText_(err));
      })
      .adminGetRescheduleDay1Options(state.token, booking.bookingID, 'en');
  }

  function bookingPickOption_(label, isCurrent, onClick) {
    var div = document.createElement('div');
    div.className = 'booking-pick-option' + (isCurrent ? ' current' : '');
    div.textContent = label;
    div.addEventListener('click', onClick);
    return div;
  }

  function markBookingPickSelected_(container, selectedEl) {
    Array.prototype.forEach.call(container.children, function (c) {
      c.classList.toggle('selected', c === selectedEl);
    });
  }

  function renderBookingDay1Options_(booking, options) {
    els.bookingDay1Options.innerHTML = '';
    var container = document.createElement('div');
    container.className = 'booking-pick-list';

    var keepLabel = 'Keep current: ' + (booking.day1 ? (booking.day1.date + ' ' + booking.day1.startTime + '\u2013' + booking.day1.endTime) : '\u2014');
    var keepOpt = bookingPickOption_(keepLabel, true, function () {
      state.bookingNewDay1 = null;
      markBookingPickSelected_(container, keepOpt);
      loadBookingDay2Options_(booking, null);
    });
    container.appendChild(keepOpt);

    options.forEach(function (slot) {
      var opt = bookingPickOption_(slot.date + ' ' + slot.startTime + '\u2013' + slot.endTime, false, function () {
        state.bookingNewDay1 = slot;
        markBookingPickSelected_(container, opt);
        loadBookingDay2Options_(booking, slot.slotID);
      });
      container.appendChild(opt);
    });

    markBookingPickSelected_(container, keepOpt); // default: keep current Day 1
    els.bookingDay1Options.appendChild(container);
  }

  function loadBookingDay2Options_(booking, candidateDay1SlotID) {
    els.bookingDay2Options.innerHTML = '';
    show_(els.bookingDay2Loading);
    state.bookingNewDay2 = null;

    if (!candidateDay1SlotID) {
      // Day 1 unchanged — just show Day 2 alternatives for the current pairing.
      google.script.run
        .withSuccessHandler(function (res) {
          hide_(els.bookingDay2Loading);
          renderBookingDay2Options_(booking, (res && res.slots) || [], true, null);
        })
        .withFailureHandler(function (err) { hide_(els.bookingDay2Loading); showBookingRescheduleError_(errorText_(err)); })
        .adminGetRescheduleDay2OptionsForCurrentDay1(state.token, booking.bookingID, 'en');
      return;
    }

    // Day 1 is changing — check whether the CURRENT Day 2 is still
    // compatible, then fetch alternatives compatible with the new Day 1.
    google.script.run
      .withSuccessHandler(function (compat) {
        google.script.run
          .withSuccessHandler(function (res) {
            hide_(els.bookingDay2Loading);
            renderBookingDay2Options_(
              booking, (res && res.slots) || [],
              !!(compat && compat.success && compat.compatible),
              compat && compat.currentDay2 ? compat.currentDay2 : null
            );
          })
          .withFailureHandler(function (err) { hide_(els.bookingDay2Loading); showBookingRescheduleError_(errorText_(err)); })
          .adminGetRescheduleDay2Options(state.token, candidateDay1SlotID, 'en', booking.bookingID);
      })
      .withFailureHandler(function () {
        google.script.run
          .withSuccessHandler(function (res) {
            hide_(els.bookingDay2Loading);
            renderBookingDay2Options_(booking, (res && res.slots) || [], false, null);
          })
          .withFailureHandler(function (err) { hide_(els.bookingDay2Loading); showBookingRescheduleError_(errorText_(err)); })
          .adminGetRescheduleDay2Options(state.token, candidateDay1SlotID, 'en', booking.bookingID);
      })
      .adminCheckCurrentDay2StillCompatible(state.token, booking.bookingID, candidateDay1SlotID, 'en');
  }

  function renderBookingDay2Options_(booking, options, canKeepCurrent, currentDay2Display) {
    els.bookingDay2Options.innerHTML = '';
    var container = document.createElement('div');
    container.className = 'booking-pick-list';
    var keepOpt = null;

    if (canKeepCurrent) {
      var label = 'Keep current: ' + (currentDay2Display
        ? (currentDay2Display.date + ' ' + currentDay2Display.startTime + '\u2013' + currentDay2Display.endTime)
        : (booking.day2 ? (booking.day2.date + ' ' + booking.day2.startTime + '\u2013' + booking.day2.endTime) : '\u2014'));
      keepOpt = bookingPickOption_(label, true, function () {
        state.bookingNewDay2 = null;
        markBookingPickSelected_(container, keepOpt);
      });
      container.appendChild(keepOpt);
    }

    options.forEach(function (slot) {
      var opt = bookingPickOption_(slot.date + ' ' + slot.startTime + '\u2013' + slot.endTime, false, function () {
        state.bookingNewDay2 = slot;
        markBookingPickSelected_(container, opt);
      });
      container.appendChild(opt);
    });

    if (!options.length && !canKeepCurrent) {
      var empty = document.createElement('p');
      empty.className = 'empty-message';
      empty.textContent = 'No compatible Day 2 slots for this Day 1 \u2014 pick a different Day 1.';
      container.appendChild(empty);
    } else if (canKeepCurrent) {
      markBookingPickSelected_(container, keepOpt); // default: keep current Day 2
    }
    // If Day 2 must change (canKeepCurrent is false), nothing is
    // pre-selected — the admin must explicitly pick one.

    els.bookingDay2Options.appendChild(container);
  }

  function onSaveBookingReschedule_() {
    if (!state.currentBookingID) return;
    hide_(els.bookingRescheduleModalError);
    var day1Arg = state.bookingNewDay1 ? state.bookingNewDay1.slotID : '';
    var day2Arg = state.bookingNewDay2 ? state.bookingNewDay2.slotID : '';
    if (!day1Arg && !day2Arg) {
      showBookingRescheduleError_('Please choose a different Day 1 or Day 2 slot.');
      return;
    }

    els.bookingRescheduleSaveBtn.disabled = true;
    show_(els.bookingRescheduleSpinner);
    google.script.run
      .withSuccessHandler(function (result) {

  // ---------------------------------------------------------------------

  // ---------------------------------------------------------------------

  function combineLocal_(dateStr, timeStr) {
    if (!dateStr || !timeStr) return null;
    var dp = dateStr.split('-');
    var tp = timeStr.split(':');
    if (dp.length !== 3 || tp.length !== 2) return null;
    var d = new Date(
      parseInt(dp[0], 10), parseInt(dp[1], 10) - 1, parseInt(dp[2], 10),
      parseInt(tp[0], 10), parseInt(tp[1], 10), 0
    );
    return isNaN(d.getTime()) ? null : d;
  }

  function hoursDiff_(a, b) { return (b.getTime() - a.getTime()) / (1000 * 60 * 60); }
  function round1_(n) { return Math.round(n * 10) / 10; }

  function addMinutesToTimeStrClient_(timeStr, minutes) {
    if (!timeStr || !minutes || minutes <= 0) return null;
    var tp = timeStr.split(':');
    if (tp.length !== 2) return null;
    var total = (parseInt(tp[0], 10) * 60 + parseInt(tp[1], 10) + Math.round(minutes)) % (24 * 60);
    var h = Math.floor(total / 60);
    var m = total % 60;
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }

  function conflictText_(conflict) {
    return 'Conflicts with ' + conflict.slotID + ' (' + conflict.date + ', ' +

    dateTd.appendChild(dateInput); tr.appendChild(dateTd);

    var startTd = document.createElement('td');
    var startInput = document.createElement('input');
    startInput.type = 'time'; startInput.className = 'bulk-day2-start';
    startTd.appendChild(startInput); tr.appendChild(startTd);

    var durTd = document.createElement('td');
    var durInput = document.createElement('input');
    durInput.type = 'number'; durInput.min = '1'; durInput.step = '5'; durInput.value = String(DAY2_DEFAULT_DURATION);
    durInput.className = 'bulk-day2-duration';
    durTd.appendChild(durInput); tr.appendChild(durTd);

    var staffTd = document.createElement('td');
    var staffSelect = document.createElement('select');
    staffSelect.className = 'bulk-day2-staff';
    populateStaffSelect_(staffSelect, null);
    staffTd.appendChild(staffSelect); tr.appendChild(staffTd);

    var langTd = document.createElement('td');
    var langSelect = document.createElement('select');
    langSelect.className = 'bulk-day2-language';
    populateLanguageSelect_(langSelect, 'any');
    langTd.appendChild(langSelect); tr.appendChild(langTd);

    var removeTd = document.createElement('td');
    var removeBtn = document.createElement('button');
    removeBtn.type = 'button'; removeBtn.className = 'btn btn-secondary btn-small';
    removeBtn.textContent = 'Remove';
    removeBtn.addEventListener('click', function () { tr.remove(); });
    removeTd.appendChild(removeBtn); tr.appendChild(removeTd);

    els.bulkDay2TableBody.appendChild(tr);
  }

  function collectBulkDay2Candidates_() {
    return Array.prototype.slice.call(els.bulkDay2TableBody.querySelectorAll('tr')).map(function (tr) {
      return {
        date: tr.querySelector('.bulk-day2-date').value,
        startTime: tr.querySelector('.bulk-day2-start').value,
        durationMinutes: parseInt(tr.querySelector('.bulk-day2-duration').value, 10),
        staffEmail: tr.querySelector('.bulk-day2-staff').value,
        language: tr.querySelector('.bulk-day2-language').value
      };
    });
  }

  function onSaveBulkDay2_() {
    clearModalBanner_(els.bulkDay2Error);
    clearModalBanner_(els.bulkDay2Success);
    var candidates = collectBulkDay2Candidates_();
    if (!candidates.length) { setModalBanner_(els.bulkDay2Error, 'Add at least one row first.', true); return; }
    var incomplete = candidates.some(function (c) { return !c.date || !c.startTime || !c.durationMinutes || !c.staffEmail; });
    if (incomplete) { setModalBanner_(els.bulkDay2Error, 'Please fill in date, start time, duration, and assigned staff for every row.', true); return; }

    els.bulkDay2SaveBtn.disabled = true;
    google.script.run
      .withSuccessHandler(function (result) {
        els.bulkDay2SaveBtn.disabled = false;
        var results = (result && result.results) || [];
        var failed = results.filter(function (r) { return !r.success; });
        if (results.length && !failed.length) {
          setModalBanner_(els.bulkDay2Success, (result && result.message) || 'Slots created.', false);
          els.bulkDay2TableBody.innerHTML = '';
          addBulkDay2Row_();
        } else if (failed.length) {
          var detail = failed.map(function (r) {
            return (r.input ? (r.input.date + ' ' + r.input.startTime) : 'row') + ': ' + (r.message || 'failed');
          }).join('\n');
          setModalBanner_(els.bulkDay2Error,
            (result && result.message) || (failed.length + ' row(s) failed.'), true, { title: 'Details', body: detail });
        } else {
          setModalBanner_(els.bulkDay2Error, (result && result.message) || 'Could not create slots.', true);
        }
        loadOverview_();
      })
      .withFailureHandler(function (err) {
        els.bulkDay2SaveBtn.disabled = false;
        if (isSessionError_(err)) { handleSessionExpired_(); return; }
        setModalBanner_(els.bulkDay2Error, errorText_(err), true);
      })
      .bulkCreateIndependentDay2Slots(state.token, candidates);
  }

  // ---------------------------------------------------------------------
  // Schedule builder modal: MRI -> Day 1 (derived) -> Day 2 (selected)
  // ---------------------------------------------------------------------

  var schedDay1CollisionTimer = null;
  var schedNewDay2RowCounter = 0;
  var schedNewDay2CollisionTimers = {};

  function openScheduleModal_(mriSlot) {
    state.currentScheduleMri = mriSlot;
    state.currentDay1DateTime = null;
    state.day1Blocked = true;

    els.scheduleModalMriText.textContent =
      'MRI slot ' + mriSlot.slotID + ' \u2014 ' + mriSlot.date + ', ' + mriSlot.startTime + '\u2013' + mriSlot.endTime;
    hide_(els.scheduleModalError);
    hide_(els.schedStaffConflictBox);
    hide_(els.schedMriOverlapBox);

    els.schedTimeBeforeMri.value = TIME_BEFORE_MRI_DEFAULT;
    els.schedMriDuration.value = mriDurationOf_(mriSlot);
    els.schedDay1DateDisplay.value = '';
    els.schedDay1StartDisplay.value = '';
    els.schedDay1EndDisplay.value = '';
    hide_(els.schedDay1CollisionMsg);
    hide_(els.schedMriResizeMsg);
    els.schedDay2ExistingList.innerHTML = '';
    hide_(els.schedDay2EmptyMsg);
    els.schedNewDay2RowsContainer.innerHTML = '';
    els.scheduleSaveBtn.disabled = true;

    populateStaffSelect_(els.schedDay1StaffSelect, null);
    els.schedDay1StaffSelect.onchange = function () {
      // Round 5 fix: the Day 1 preview now needs to know WHICH staff member
      // is selected to detect a same-staff conflict on a permitted overlap
      // (previously this only re-ran the separate, legacy staff-busy check
      // and never re-validated Day 1 itself against the new staff choice).
      refreshScheduleDay1_();
    };
    populateLanguageSelect_(els.schedLanguageSelect, null);
    // Round 9 fix: the existing-Day2 candidate list (the "22\u201326h window"
    // list) never reacted to the Session Language dropdown at all \u2014 it
    // showed every compatible Day 2 slot regardless of language and never
    // displayed each slot's own language. Re-running the Day 1 preview
    // pipeline on change re-filters/re-labels that list (see
    // refreshScheduleDay2Window_ below).
    els.schedLanguageSelect.onchange = function () { refreshScheduleDay1_(); };

    show_(els.scheduleModalOverlay);
    refreshScheduleDay1_();
  }

  // NOTE (round 5): the old "Step 3 — staff availability" check
  // (refreshStaffConflictCheck_ / collectDay2StaffEmails_, backed by the
  // legacy checkStaffAvailability endpoint) has been REMOVED. It duplicated
  // — and could disagree with — the per-row, config-driven live checks that
  // now cover Day 1 (previewDay1FromMri) and every Day 2 row (checkSlotOverlap
  // via refreshExistingDay2Row_ / refreshSchedNewDay2Row_), all of which
  // route through the same centralized validateSchedulingSlot_ engine.

  /** Derives an MRI slot's current duration in minutes from its start/end. */
  function mriDurationOf_(mriSlot) {
    if (mriSlot.startMs && mriSlot.endMs && mriSlot.endMs > mriSlot.startMs) {
      return Math.round((mriSlot.endMs - mriSlot.startMs) / 60000);
    }
    return MRI_DEFAULT_DURATION;
  }

  function closeScheduleModal_() {
    hide_(els.scheduleModalOverlay);
    state.currentScheduleMri = null;
    state.currentDay1DateTime = null;
    els.scheduleSaveBtnText.textContent = 'Save Schedule';
    // If the admin cancelled out of a Bulk Scheduling "Configure" step, put
    // them back on the Bulk dialog rather than dropping them on the dashboard.
    if (state.bulkConfigMode) {
      state.bulkConfigMode = false;
      refreshBulkPushRowStatus_();
    }
  }

  function refreshScheduleDay1_() {
    var offset = parseInt(els.schedTimeBeforeMri.value, 10);
    var mriDuration = parseInt(els.schedMriDuration.value, 10);
    if (!state.currentScheduleMri || !offset || offset <= 0 || !mriDuration || mriDuration <= 0) {
      state.day1Blocked = true;
      els.scheduleSaveBtn.disabled = true;
      return;
    }

    clearTimeout(schedDay1CollisionTimer);
    schedDay1CollisionTimer = setTimeout(function () {
      var day1StaffEmail = els.schedDay1StaffSelect ? els.schedDay1StaffSelect.value : '';
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.success) {
            showScheduleError_((res && res.message) || 'Could not calculate Day 1.');
            state.day1Blocked = true;
            els.scheduleSaveBtn.disabled = true;
            return;
          }
          hide_(els.scheduleModalError);
          els.schedDay1DateDisplay.value = res.day1Date;
          els.schedDay1StartDisplay.value = res.day1StartTime;
          els.schedDay1EndDisplay.value = res.day1EndTime;
          state.currentDay1DateTime = combineLocal_(res.day1Date, res.day1StartTime);

          if (res.mriEndChanged) {
            els.schedMriResizeMsg.textContent =
              'Saving will also resize MRI slot ' + state.currentScheduleMri.slotID + ' to end at ' + res.day1EndTime + '.';
            show_(els.schedMriResizeMsg);
          } else {
            hide_(els.schedMriResizeMsg);
          }

          // Round 5 fix: track the block state EXPLICITLY (not by asking
          // whether a message element happens to be visible), and use the
          // server's own error/warning text — which already names the
          // conflicting slot AND the assigned staff member — instead of a
          // client-reconstructed generic message.
          var errors = res.errors || [];
          var warnings = res.warnings || [];
          state.day1Blocked = errors.length > 0;

          els.schedDay1CollisionMsg.innerHTML = '';
          if (errors.length) {
            var errSpan = document.createElement('span');
            errSpan.textContent = errors[0];
            els.schedDay1CollisionMsg.appendChild(errSpan);
            appendViewAllConflicts_(els.schedDay1CollisionMsg, errors, warnings, 1);
            els.schedDay1CollisionMsg.className = 'tag tag-bad';
            show_(els.schedDay1CollisionMsg);
          } else if (warnings.length) {
            // Overlap permitted by the Scheduling Rules — informational
            // only, doesn't block Save. If the SAME staff member is chosen
            // for both slots, that already surfaced as an error above
            // instead (asking to pick a different staff member).
            var warnSpan = document.createElement('span');
            warnSpan.textContent = 'Note: ' + warnings[0];
            els.schedDay1CollisionMsg.appendChild(warnSpan);
            appendViewAllConflicts_(els.schedDay1CollisionMsg, [], warnings, 1);
            els.schedDay1CollisionMsg.className = 'tag tag-warn';
            show_(els.schedDay1CollisionMsg);
          } else {
            hide_(els.schedDay1CollisionMsg);
          }

          if (!errors.length) {
            // Day 1 moved, so every new-Day2 row's compatibility badge is stale.
            els.schedNewDay2RowsContainer.querySelectorAll('.day2-row').forEach(refreshSchedNewDay2Row_);
            refreshScheduleDay2Window_(res.day1Date, res.day1StartTime);
            refreshMriOverlapBox_();
          }
          refreshScheduleSaveState_();
        })
        .withFailureHandler(function (err) {
          if (isSessionError_(err)) { closeScheduleModal_(); handleSessionExpired_(); return; }
          showScheduleError_('Unexpected error: ' + errorText_(err));
        })
        .previewDay1FromMri(state.token, state.currentScheduleMri.slotID, offset, mriDuration, day1StaffEmail);
    }, COLLISION_CHECK_DEBOUNCE_MS);
  }

  function refreshScheduleDay2Window_(day1Date, day1Start) {
    show_(els.schedDay2Loading);
    hide_(els.schedDay2EmptyMsg);

    // Remember what was already ticked. This function re-renders the whole
    // list every time the Day 1 preview resolves (which happens on every
    // keystroke in the offset/duration fields), so without this the admin's
    // Day 2 selections would silently vanish mid-edit.
    var previouslyChecked = {};
    var previouslyStaffed = {};
    els.schedDay2ExistingList.querySelectorAll('.day2-staff-row').forEach(function (row) {
      var cb = row.querySelector('input[type="checkbox"]');
      var sel = row.querySelector('select');
      if (cb && cb.checked) previouslyChecked[cb.value] = true;
      if (cb && sel && sel.value) previouslyStaffed[cb.value] = sel.value;
    });
    els.schedDay2ExistingList.innerHTML = '';

    google.script.run
      .withSuccessHandler(function (slots) {
        hide_(els.schedDay2Loading);
        // Round 9 fix: filter the existing-Day2 candidate list against the
        // schedule's own Session Language choice, same as new Day 2 rows
        // already share it \u2014 an existing Day 2 slot tagged for a
        // DIFFERENT language than the one chosen for this schedule isn't a
        // real option and shouldn't be offered.
        var filterLang = els.schedLanguageSelect ? els.schedLanguageSelect.value : 'any';
        slots = (slots || []).filter(function (s) {
          return slotLanguageMatchesFilter_(s.language, filterLang);
        });
        if (!slots || slots.length === 0) {
          show_(els.schedDay2EmptyMsg);
        } else {
          slots.forEach(function (slot) {
            var row = document.createElement('div');
            row.className = 'day2-staff-row';

            var cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.value = slot.slotID;
            if (previouslyChecked[slot.slotID]) cb.checked = true;

            var label = document.createElement('span');
            label.className = 'slot-label';
            label.textContent = slot.slotID + ' \u2014 ' + slot.date + ', ' + slot.startTime + '\u2013' + slot.endTime +
              ' (' + languageLabel_(slot.language) + ')';

            // Round 5 fix: a live, staff-aware tag (not a static once-computed
            // hint) — reflects the currently selected staff member and the
            // Scheduling Rules, exactly like new Day 2 rows.
            var tag = document.createElement('span');
            tag.className = 'tag hidden';
            label.appendChild(document.createTextNode(' '));
            label.appendChild(tag);

            // Each Day 2 slot carries its OWN staff assignment.
            var staffSel = buildStaffSelect_(previouslyStaffed[slot.slotID] || slot.assignedStaff || null);
            staffSel.className = 'row-staff';

            var refreshThisRow = function () {
              refreshExistingDay2Row_(row, slot, tag, staffSel);
            };
            cb.addEventListener('change', function () {
              refreshThisRow();
              refreshScheduleSaveState_();
            });
            staffSel.addEventListener('change', function () {
              if (!cb.checked) cb.checked = true;
              refreshThisRow();
              refreshScheduleSaveState_();
            });
            refreshThisRow();

            row.appendChild(cb);
            row.appendChild(label);
            row.appendChild(staffSel);
            els.schedDay2ExistingList.appendChild(row);
          });
        }
        refreshScheduleSaveState_();
      })
      .withFailureHandler(function (err) {
        hide_(els.schedDay2Loading);
        if (isSessionError_(err)) { closeScheduleModal_(); handleSessionExpired_(); return; }
        showScheduleError_('Could not load Day 2 window: ' + errorText_(err));
      })
      .getDay2SlotsInWindowForAdmin(state.token, day1Date, day1Start,
        parseInt(els.schedTimeBeforeMri.value, 10) + parseInt(els.schedMriDuration.value, 10));
  }

  function addSchedDay2Row_() {
    schedNewDay2RowCounter++;
    var row = document.createElement('div');
    row.className = 'day2-row';
    row.id = 'sched-day2row-' + schedNewDay2RowCounter;

    row.appendChild(fieldGroup_('Date', 'date', 'row-date'));
    row.appendChild(fieldGroup_('Start Time', 'time', 'row-start'));
    row.appendChild(numberFieldGroup_('Duration (min)', 'row-duration', DAY2_DEFAULT_DURATION));

    var endGroup = document.createElement('div');
    endGroup.className = 'form-group';
    var endLabel = document.createElement('label');
    endLabel.textContent = 'End (calc.)';
    var endInput = document.createElement('input');
    endInput.type = 'text';
    endInput.className = 'row-end-display';
    endInput.readOnly = true;
    endGroup.appendChild(endLabel);
    endGroup.appendChild(endInput);
    row.appendChild(endGroup);

    // Per-slot staff assignment, required before this row can be saved.
    var staffGroup = document.createElement('div');
    staffGroup.className = 'form-group';
    var staffLabel = document.createElement('label');
    staffLabel.textContent = 'Assigned Staff';
    var staffSel = buildStaffSelect_(null);
    staffSel.className = 'row-staff';
    staffSel.addEventListener('change', function () {
      // Round 5 fix: changing the staff dropdown used to only call the old,
      // non-staff-aware-for-this-row legacy check — it never re-ran THIS
      // row's own live overlap check, so a same-staff conflict introduced by
      // picking a particular staff member was never detected until Save.
      refreshSchedNewDay2Row_(row);
    });
    staffGroup.appendChild(staffLabel);
    staffGroup.appendChild(staffSel);
    row.appendChild(staffGroup);

    var tag = document.createElement('span');
    tag.className = 'tag tag-pending';
    tag.textContent = 'Incomplete';
    row.appendChild(tag);

    var removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'row-remove-btn';
    removeBtn.innerHTML = '&times;';
    removeBtn.title = 'Remove this Day 2 slot';
    removeBtn.addEventListener('click', function () {
      row.remove();
      refreshScheduleSaveState_();
    });
    row.appendChild(removeBtn);

    els.schedNewDay2RowsContainer.appendChild(row);
    row.querySelectorAll('input').forEach(function (input) {
      input.addEventListener('input', function () { refreshSchedNewDay2Row_(row); });
    });
    refreshSchedNewDay2Row_(row);
  }

  function fieldGroup_(labelText, inputType, className) {
    var group = document.createElement('div');
    group.className = 'form-group';
    var label = document.createElement('label');
    label.textContent = labelText;
    var input = document.createElement('input');
    input.type = inputType;
    input.className = className;
    group.appendChild(label);
    group.appendChild(input);
    return group;
  }

  function numberFieldGroup_(labelText, className, defaultValue) {
    var group = document.createElement('div');
    group.className = 'form-group';
    var label = document.createElement('label');
    label.textContent = labelText;
    var input = document.createElement('input');
    input.type = 'number';
    input.min = '1';
    input.step = '5';
    input.value = defaultValue;
    input.className = className;
    group.appendChild(label);
    group.appendChild(input);
    return group;
  }

  /**
   * Live, staff-aware check for an EXISTING Day 2 slot's row in the "select
   * from available Day 2 slots" list. Round 5 fix: replaces the old static,
   * once-computed "overlaps MRI" hint (which never reflected the actually
   * selected staff member) with a per-selection check through the same
   * centralized validator everything else uses.
   */
  function refreshExistingDay2Row_(row, slot, tag, staffSel) {
    var staffEmail = staffSel.value || '';
    if (!staffEmail) {
      tag.className = 'tag hidden';
      tag.textContent = '';
      row.dataset.blocked = '';
      return;
    }
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res) return;
        tag.innerHTML = '';
        if (res.overlaps) {
          var errs = res.errors || [];
          tag.className = 'tag tag-bad';
          var errSpan = document.createElement('span');
          errSpan.textContent = errs[0] || 'Not permitted';
          tag.appendChild(errSpan);
          appendViewAllConflicts_(tag, errs, res.warnings || [], 1);
          row.dataset.blocked = '1';
        } else if (res.warnings && res.warnings.length) {
          tag.className = 'tag tag-warn';
          var warnSpan = document.createElement('span');
          warnSpan.textContent = res.warnings[0];
          tag.appendChild(warnSpan);
          appendViewAllConflicts_(tag, [], res.warnings, 1);
          row.dataset.blocked = '';
        } else {
          tag.className = 'tag hidden';
          row.dataset.blocked = '';
        }
        refreshScheduleSaveState_();
      })
      .withFailureHandler(function () { /* non-blocking */ })
      .checkSlotOverlap(state.token, 'day2', {
        date: slot.rawDate,
        startTime: slot.rawStart,
        durationMinutes: Math.round((slot.endMs - slot.startMs) / 60000),
        staffEmail: staffEmail,
        excludeSlotID: slot.slotID
      });
  }

  function refreshSchedNewDay2Row_(row) {
    var dateInput = row.querySelector('.row-date');
    var startInput = row.querySelector('.row-start');
    var durationInput = row.querySelector('.row-duration');
    var endDisplay = row.querySelector('.row-end-display');
    var tag = row.querySelector('.tag');

    var duration = parseInt(durationInput.value, 10);
    var endStr = addMinutesToTimeStrClient_(startInput.value, duration);
    endDisplay.value = endStr || '';

    var rowComplete = !!(dateInput.value && startInput.value && duration > 0 && endStr);
    if (!rowComplete) {
      tag.className = 'tag tag-pending';
      tag.textContent = 'Incomplete';
      refreshScheduleSaveState_();
      return;
    }

    if (!state.currentDay1DateTime) {
      tag.className = 'tag tag-pending';
      tag.textContent = 'Waiting on Day 1\u2026';
      refreshScheduleSaveState_();
      return;
    }

    var day2DateTime = combineLocal_(dateInput.value, startInput.value);
    var diff = hoursDiff_(state.currentDay1DateTime, day2DateTime);
    if (diff < MAPPING_MIN_HOURS || diff > MAPPING_MAX_HOURS) {
      tag.className = 'tag tag-bad';
      tag.textContent = 'Not compatible (' + round1_(diff) + 'h apart)';
      refreshScheduleSaveState_();
      return;
    }

    tag.className = 'tag tag-ok';
    tag.textContent = 'Compatible (' + round1_(diff) + 'h apart)';
    refreshScheduleSaveState_();

    var rowKey = row.id;
    clearTimeout(schedNewDay2CollisionTimers[rowKey]);
    schedNewDay2CollisionTimers[rowKey] = setTimeout(function () {
      var staffSel = row.querySelector('.row-staff');
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res) return;
          row.title = '';
          tag.innerHTML = '';
          // Round 5 fix: use the validator's own rich text (already names
          // the conflicting slot AND the assigned staff member) instead of a
          // generic client-reconstructed message.
          if (res.overlaps) {
            var errs = res.errors || [];
            tag.className = 'tag tag-bad';
            var errSpan = document.createElement('span');
            errSpan.textContent = errs[0] || 'Not permitted';
            tag.appendChild(errSpan);
            appendViewAllConflicts_(tag, errs, res.warnings || [], 1);
            row.dataset.blocked = '1';
          } else if (res.warnings && res.warnings.length) {
            tag.className = 'tag tag-warn';
            var warnSpan = document.createElement('span');
            warnSpan.textContent = res.warnings[0];
            tag.appendChild(warnSpan);
            appendViewAllConflicts_(tag, [], res.warnings, 1);
            row.dataset.blocked = '';
          } else {
            row.dataset.blocked = '';
          }
          refreshScheduleSaveState_();
        })
        .withFailureHandler(function () { /* non-blocking */ })
        .checkSlotOverlap(state.token, 'day2', {
          date: dateInput.value,
          startTime: startInput.value,
          durationMinutes: duration,
          staffEmail: staffSel ? staffSel.value : ''
        });
    }, COLLISION_CHECK_DEBOUNCE_MS);
  }

  function refreshScheduleSaveState_() {
    // Round 5 fix: this used to gate on whether the Day 1 collision message
    // element was merely VISIBLE — but a permitted-overlap WARNING is shown
    // in that same element (intentionally, so the admin sees it), which was
    // being misread as a hard block and left Save disabled even when the
    // overlap was allowed. Now it checks the explicit block flag that
    // refreshScheduleDay1_ sets from the validator's actual errors array.
    var day1Ready = !!(els.schedDay1DateDisplay.value && els.schedDay1StartDisplay.value) &&
      !state.day1Blocked;

    var day1StaffChosen = !!els.schedDay1StaffSelect.value;

    // Every TICKED existing Day 2 row must have a staff member and must not
    // be flagged blocked by its live, staff-aware check.
    var tickedCount = 0;
    var tickedAllStaffed = true;
    var tickedNoneBlocked = true;
    els.schedDay2ExistingList.querySelectorAll('.day2-staff-row').forEach(function (row) {
      var cb = row.querySelector('input[type="checkbox"]');
      var sel = row.querySelector('select');
      if (cb && cb.checked) {
        tickedCount++;
        if (!sel || !sel.value) tickedAllStaffed = false;
        if (row.dataset.blocked === '1') tickedNoneBlocked = false;
      }
    });

    // Every VALID new Day 2 row must have a staff member and must not be
    // flagged blocked by its live check either.
    var newOkCount = 0;
    var newAllStaffed = true;
    var newNoneBlocked = true;
    els.schedNewDay2RowsContainer.querySelectorAll('.day2-row').forEach(function (row) {
      var tag = row.querySelector('.tag');
      var sel = row.querySelector('.row-staff');
      // 'tag-warn' means valid-but-permitted-overlap, which is allowed.
      if (tag && (tag.classList.contains('tag-ok') || tag.classList.contains('tag-warn'))) {
        newOkCount++;
        if (!sel || !sel.value) newAllStaffed = false;
        if (row.dataset.blocked === '1') newNoneBlocked = false;
      }
    });

    var haveDay2 = (tickedCount + newOkCount) > 0;
    var allStaffed = tickedAllStaffed && newAllStaffed;
    var noneBlocked = tickedNoneBlocked && newNoneBlocked;

    els.scheduleSaveBtn.disabled =
      !(day1Ready && day1StaffChosen && haveDay2 && allStaffed && noneBlocked);
  }

  /** Lists the experiments this MRI slot sits on top of, inside the builder. */
  function refreshMriOverlapBox_() {
    if (!state.currentScheduleMri) return;
    google.script.run
      .withSuccessHandler(function (res) {
        var warnings = (res && res.experimentWarnings) || [];
        if (!warnings.length) { hide_(els.schedMriOverlapBox); return; }
        els.schedMriOverlapList.innerHTML = '';
        warnings.forEach(function (w) {
          var li = document.createElement('li');

          els.schedMriOverlapList.appendChild(li);
        });

      })
      .withFailureHandler(function () { /* non-blocking */ })

        date: state.currentScheduleMri.rawDate,

  function showScheduleError_(text) {
