  /**
   * Spec: Simplified Conflict Messages (#2) — shows only the single
   * highest-priority conflict/error inline, with a "View All Conflicts"
   * link when there is more than one error and/or any warnings.
   * @param {Object} result - a failed server result, expected to carry
   *   .errors (Array<string>) and/or .warnings (Array<string>) and/or
   *   a plain .message fallback.
   */
  function showScheduleConflictError_(result) {
    setConciseConflictBanner_(els.scheduleModalError, result, 'Could not save the schedule.');
    show_(els.scheduleModalError);
  }

  /**
   * Collects the current scheduling dialog state into the exact payload shape
   * createScheduleFromMri expects. Shared by the individual save path and the
   * Bulk Scheduling "Configure" flow, so the two workflows can never drift
   * apart (spec round 3, #2/#4).
   * @return {?Object} payload, or null if nothing valid is selected (an error
   *   banner is shown in that case).
   */
  function collectSchedulePayload_() {
    if (!state.currentScheduleMri) return null;

    // Existing Day 2 selections, each with its own staff member.
    var existingDay2 = [];
    els.schedDay2ExistingList.querySelectorAll('.day2-staff-row').forEach(function (row) {
      var cb = row.querySelector('input[type="checkbox"]');
      var sel = row.querySelector('select');
      if (cb && cb.checked) {
        existingDay2.push({ slotID: cb.value, staffEmail: sel ? sel.value : '' });
      }
    });

    // New Day 2 rows, each with its own staff member.
    var newList = [];
    els.schedNewDay2RowsContainer.querySelectorAll('.day2-row').forEach(function (row) {
      var tag = row.querySelector('.tag');
      if (!tag.classList.contains('tag-ok') && !tag.classList.contains('tag-warn')) return;
      newList.push({
        date: row.querySelector('.row-date').value,
        startTime: row.querySelector('.row-start').value,
        durationMinutes: parseInt(row.querySelector('.row-duration').value, 10),
        staffEmail: row.querySelector('.row-staff').value,
        // Round 7: new Day 2 slots created as part of building this
        // schedule share the same Session Language as Day 1 — a single
        // MRI-derived schedule is conducted in one language throughout.
        // Existing Day 2 slots picked via checkbox keep their own,
        // already-set language rather than being overwritten here.
        language: els.schedLanguageSelect ? els.schedLanguageSelect.value : 'any'
      });
    });

    if (existingDay2.length === 0 && newList.length === 0) {
      showScheduleError_('Select at least one existing Day 2 slot, or add a new one.');
      return null;
    }

    return {
      mriSlotID: state.currentScheduleMri.slotID,
      day1StaffEmail: els.schedDay1StaffSelect.value,
      timeBeforeMriMinutes: parseInt(els.schedTimeBeforeMri.value, 10),
      mriDurationMinutes: parseInt(els.schedMriDuration.value, 10),
      existingDay2: existingDay2,
      newDay2List: newList,
      language: els.schedLanguageSelect ? els.schedLanguageSelect.value : 'any'
    };
  }

  function onSaveSchedule_() {
    if (!state.currentScheduleMri) return;
    hide_(els.scheduleModalError);

    var payload = collectSchedulePayload_();
    if (!payload) return;

    // Bulk Scheduling reuses this exact dialog. In that mode "Save" captures
    // the configuration for later batch submission instead of committing it.
    // (closeScheduleModal_ resets bulk mode and re-shows the Bulk dialog.)
    if (state.bulkConfigMode) {
      state.bulkConfigs[payload.mriSlotID] = payload;
      closeScheduleModal_();
      setModalBanner_(els.bulkMriSuccess,
        'Schedule configured for MRI slot ' + payload.mriSlotID + '. Configure any others, then push them all.', false);
      return;
    }

    setBusy_(els.scheduleSaveBtn, els.scheduleSaveBtnText, els.scheduleSaveSpinner, true, 'Saving\u2026');
    google.script.run
      .withSuccessHandler(function (result) {
        setBusy_(els.scheduleSaveBtn, els.scheduleSaveBtnText, els.scheduleSaveSpinner, false, 'Save Schedule');
        if (result && result.success) {
          var s = result.addedSummary || {};
          closeScheduleModal_();

          // Spec example, verbatim shape:
          //   Experiment Schedule Updated Successfully
          //   MRI: MRI-001 / Day 1: D1-002 / Day 2: D2-002
          var day2Ids = (s.day2 || []).map(function (d) { return String(d).split(' ')[0]; });
          var lines = [
            'MRI: ' + s.mri,
            'Day 1: ' + (s.day1 || '').split(' ')[0],
            'Day 2: ' + day2Ids.join(', ')
          ];
          var warns = (result.warnings || []).concat(result.mriOverlapWarnings || []);
          var detailsBody =
            'MRI slot: ' + s.mri + '\n' +
            'Day 1 slot: ' + s.day1 + ' (staff: ' + (s.day1StaffName || s.day1Staff) + ')\n' +
            'Day 2 slot(s): ' + (s.day2 || []).join(', ') + '\n' +
            'Created by: ' + (s.createdByName || s.createdBy) +
            (warns.length ? '\n\nPermitted-overlap warnings:\n\u2022 ' + warns.join('\n\u2022 ') : '');

          showSuccess_('Experiment Schedule Updated Successfully', lines,
            { title: 'Schedule Details', body: detailsBody });
          loadOverview_();
        } else {
          showScheduleConflictError_(result);
        }
      })
      .withFailureHandler(function (err) {
        setBusy_(els.scheduleSaveBtn, els.scheduleSaveBtnText, els.scheduleSaveSpinner, false, 'Save Schedule');
        if (isSessionError_(err)) { closeScheduleModal_(); handleSessionExpired_(); return; }
        showScheduleError_('Unexpected error: ' + errorText_(err));
      })
      .createScheduleFromMri(state.token, payload);
  }

  function setBusy_(btn, textEl, spinnerEl, busy, busyLabel) {
    btn.disabled = busy;
    if (busy) {
      show_(spinnerEl);
      textEl.dataset.idleLabel = textEl.dataset.idleLabel || textEl.textContent;
      textEl.textContent = busyLabel;
    } else {
      hide_(spinnerEl);
      textEl.textContent = textEl.dataset.idleLabel || textEl.textContent;
    }
  }

  /**
   * Renders a concise notification: a short bold title, an optional handful
   * of short "Label: value" lines, and — when `details` is supplied — a
   * "View Details" button that opens the full information in a modal
   * (spec: Concise Notifications, #1). Backward compatible: existing calls
   * passing just a single string still work (rendered as the title alone).
   * @param {string} kind - 'success' | 'error'
   * @param {string} title
   * @param {Array<string>} [lines]
   * @param {{title?: string, body: string}} [details]
   */
  function showConciseBanner_(kind, title, lines, details) {
    els.adminMessageTitle.textContent = title;
    els.adminMessageLines.innerHTML = '';
    (lines || []).forEach(function (line) {
      var li = document.createElement('li');
      li.textContent = line;
      els.adminMessageLines.appendChild(li);
    });
    els.adminMessageLines.classList.toggle('hidden', !(lines && lines.length));
    if (details && details.body) {
      els.adminMessageDetailsBtn.classList.remove('hidden');
      els.adminMessageDetailsBtn.onclick = function () {
        openDetailsModal_(details.title || title, details.body);
      };
    } else {
      els.adminMessageDetailsBtn.classList.add('hidden');
      els.adminMessageDetailsBtn.onclick = null;
    }
    els.adminMessageBanner.className = 'banner banner-' + kind;
    els.adminMessageBanner.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function showError_(title, lines, details) { showConciseBanner_('error', title, lines, details); }
  function showSuccess_(title, lines, details) { showConciseBanner_('success', title, lines, details); }

  function clearMessage_() {
    els.adminMessageTitle.textContent = '';
    els.adminMessageLines.innerHTML = '';
    els.adminMessageDetailsBtn.classList.add('hidden');
    els.adminMessageDetailsBtn.onclick = null;
    els.adminMessageBanner.className = 'banner hidden';
  }

  /** Opens the generic Details modal (spec: "View Details" / "View All Conflicts"). */
  function openDetailsModal_(title, bodyText) {
    els.detailsModalTitle.textContent = title || 'Details';
    els.detailsModalBody.textContent = bodyText || '';
    show_(els.detailsModalOverlay);
  }

  function errorText_(err) {
    if (!err) return 'Unknown error';
    return err.message || String(err);
  }

  /**
   * @param {HTMLElement} el
   * @param {string} text - short/concise message
   * @param {boolean} isError
   * @param {{title?: string, body: string}} [details] - if given, appends a
   *   "View Details" link that opens the full text in the generic Details modal.
   */
  /**
   * Spec: Simplified Conflict Messages (#2) — the shared version of
   * showScheduleConflictError_ for ordinary modal banners: shows only the
   * single highest-priority error/message, with "View All Conflicts" when
   * there's more than one error and/or any warnings.
   * @param {HTMLElement} bannerEl
   * @param {Object} result - failed server result, expected to carry
   *   .errors / .warnings arrays and/or a plain .message fallback.
   * @param {string} fallbackMessage
   */
  /**
   * Appends a small "View All Conflicts (N)" link to a container when there
   * are more errors/warnings than the `shownCount` already displayed inline
   * (spec: Simplified Conflict Messages, #2/#3 — keep inline messages to the
   * single highest-priority item, put the rest behind a details link).
   */
  function appendViewAllConflicts_(container, errors, warnings, shownCount) {
    var total = errors.length + warnings.length;
    if (total <= shownCount) return;
    container.appendChild(document.createTextNode(' '));
    var link = document.createElement('button');
    link.type = 'button';
    link.className = 'concise-details-btn';
    link.textContent = 'View All (' + total + ')';
    link.addEventListener('click', function (ev) {
      ev.stopPropagation();
      var body = '';
      if (errors.length) body += 'Errors:\n\u2022 ' + errors.join('\n\u2022 ') + '\n\n';
      if (warnings.length) body += 'Warnings:\n\u2022 ' + warnings.join('\n\u2022 ');
      openDetailsModal_('All Conflicts', body.trim());
    });
    container.appendChild(link);
  }

  function setConciseConflictBanner_(bannerEl, result, fallbackMessage) {
    var errors = (result && result.errors) || [];
    var warnings = (result && result.warnings) || [];
    var primary = errors[0] || (result && result.message) || fallbackMessage;
    var extraCount = Math.max(0, errors.length - 1) + warnings.length;
    setModalBanner_(bannerEl, primary, true, extraCount > 0 ? {
      title: 'All Conflicts',
      body: (errors.length ? 'Errors:\n\u2022 ' + errors.join('\n\u2022 ') + '\n\n' : '') +
            (warnings.length ? 'Warnings:\n\u2022 ' + warnings.join('\n\u2022 ') : '')
    } : undefined);
  }

  function setModalBanner_(el, text, isError, details) {
    if (!el) return;
    el.innerHTML = '';
    var span = document.createElement('span');
    span.textContent = text;
    el.appendChild(span);
    if (details && details.body) {
      el.appendChild(document.createTextNode(' '));
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'concise-details-btn';
      btn.textContent = 'View Details';
      btn.addEventListener('click', function () { openDetailsModal_(details.title || text, details.body); });
      el.appendChild(btn);
    }
    el.className = 'banner ' + (isError ? 'banner-error' : 'banner-success');
  }
  function clearModalBanner_(el) {
    if (!el) return;
    el.innerHTML = '';
    el.className = 'banner hidden';
  }

  function populateCbDay1Select_() {
    els.cbDay1Select.innerHTML = '';
    var filterLang = els.cbLanguageSelect ? els.cbLanguageSelect.value : 'any';
    var available = (state.day1Slots || []).filter(function (s) {

    });

    els.cbDay1Select.appendChild(blank);

    });

  // Round 7: mirrors slotLanguageMatchesFilter_ in Code.gs — an 'any'
  // slot or an 'any'/blank filter always matches; otherwise the two must
  // agree. Kept in sync with the server-side implementation.
  function slotLanguageMatchesFilter_(slotLanguage, filterLanguage) {
    var filter = String(filterLanguage || '').trim().toLowerCase();
    if (!filter || filter === 'any') return true;
    var slot = String(slotLanguage || '').trim().toLowerCase() || 'any';
    return slot === 'any' || slot === filter;
  }

  function languageLabel_(key) {
    var found = (state.languageOptions || []).filter(function (l) { return l.key === key; })[0];
    if (found) return found.label;
    if (key === 'en') return 'English';
    if (key === 'de') return 'German';
    return 'Any / No preference';
  }

  function onCbDay1Change_() {
    els.cbDay2Select.innerHTML = '';
    var day1ID = els.cbDay1Select.value;
    var day1 = (state.day1Slots || []).filter(function (s) { return s.slotID === day1ID; })[0];
    if (!day1) {
      var none = document.createElement('option');
      none.value = ''; none.textContent = 'Select a Day 1 slot first';
      els.cbDay2Select.appendChild(none);
      return;
    }
    var filterLang = els.cbLanguageSelect ? els.cbLanguageSelect.value : 'any';
    var MIN_H = 22, MAX_H = 26; // mirrors CONFIG.MAPPING_WINDOW_MIN/MAX_HOURS
    var compatible = (state.day2Slots || []).filter(function (s) {
      if (s.booked) return false;
      if (!slotLanguageMatchesFilter_(s.language, filterLang)) return false;
      var diffHrs = (s.startMs - day1.startMs) / 3600000;
      return diffHrs >= MIN_H && diffHrs <= MAX_H;
    });
    var blank = document.createElement('option');
    blank.value = ''; blank.textContent = compatible.length ? 'Select\u2026' : 'No compatible Day 2 slots for that language';
    els.cbDay2Select.appendChild(blank);
    compatible.forEach(function (s) {
      var opt = document.createElement('option');
      opt.value = s.slotID;
      opt.textContent = s.slotID + ' (' + s.date + ' ' + s.startTime + '\u2013' + s.endTime + ')';
      els.cbDay2Select.appendChild(opt);
    });
  }

  function refreshBdTableView_() {

  function onPushBulkMriToSchedule_() {
    clearModalBanner_(els.bulkMriError);
    clearModalBanner_(els.bulkMriSuccess);
    var rows = Array.prototype.slice.call(els.bulkMriPushTableBody.querySelectorAll('tr'))
      .filter(function (tr) { return tr.querySelector('.bulk-mri-push-select').checked; });
    if (!rows.length) { setModalBanner_(els.bulkMriError, 'Select at least one MRI slot to push.', true); return; }

    var entries = [];
    var unconfigured = [];
    rows.forEach(function (tr) {
      var cfg = state.bulkConfigs[tr.dataset.mriSlotId];
      if (!cfg) { unconfigured.push(tr.dataset.mriSlotId); return; }
      entries.push(cfg);
    });

    if (unconfigured.length) {
      setModalBanner_(els.bulkMriError,
        'Configure these selected MRI slot(s) first: ' + unconfigured.join(', ') + '.', true);
      return;
    }

    google.script.run
      .withSuccessHandler(function (result) {
        if (result && result.success) {
          var created = result.created || [];
          var detailsBody = created.map(function (s) {
            return 'MRI ' + s.mriSlotID + ' \u2192 Day 1 ' + s.day1SlotID + ', Day 2: ' + (s.day2SlotIDs || []).join(', ');
          }).join('\n') + (result.warnings && result.warnings.length
            ? '\n\nPermitted-overlap warnings:\n\u2022 ' + result.warnings.join('\n\u2022 ') : '');
          setModalBanner_(els.bulkMriSuccess, created.length + ' schedule(s) created successfully.', false,
            { title: 'Bulk Scheduling Details', body: detailsBody });
          loadOverview_();
        } else {
          var errs = (result && result.errors) || [];
          var warns = (result && result.warnings) || [];
          var primary = errs[0] || (result && result.message) || 'Could not push schedules.';
          var extra = Math.max(0, errs.length - 1) + warns.length;
          setModalBanner_(els.bulkMriError, primary, true, extra > 0 ? {
            title: 'All Conflicts',
            body: (errs.length ? 'Errors:\n\u2022 ' + errs.join('\n\u2022 ') + '\n\n' : '') +
                  (warns.length ? 'Warnings:\n\u2022 ' + warns.join('\n\u2022 ') : '')
          } : undefined);
        }
      })
      .withFailureHandler(function (err) {
        if (isSessionError_(err)) { handleSessionExpired_(); return; }
        setModalBanner_(els.bulkMriError, errorText_(err), true);
      })
      .bulkCreateSchedulesFromMri(state.token, entries);
  }

  // =====================================================================
  // 2026-08 requirements pass (round 5) — Records & Audit (soft delete, #5)
  // =====================================================================

  function openRecordsModal_() {
    clearModalBanner_(els.recordsError);
    clearModalBanner_(els.recordsSuccess);
    els.recordsTableHead.innerHTML = '';
    els.recordsTableBody.innerHTML = '';
    els.recordsCount.textContent = '';
    show_(els.recordsModalOverlay);
    loadRecords_();
  }

  function loadRecords_() {
    clearModalBanner_(els.recordsError);
    clearModalBanner_(els.recordsSuccess);
    els.recordsCount.textContent = 'Loading\u2026';
    var sheetKey = els.recordsSheetSelect.value;
    var scope = els.recordsScopeSelect.value;
    google.script.run
      .withSuccessHandler(function (result) {
        if (!result || !result.success) {
          els.recordsCount.textContent = '';
          setModalBanner_(els.recordsError, (result && result.message) || 'Could not load records.', true);
          return;
        }
        renderRecords_(result, sheetKey, scope);
      })
      .withFailureHandler(function (err) {
        els.recordsCount.textContent = '';
        if (isSessionError_(err)) { handleSessionExpired_(); return; }
        setModalBanner_(els.recordsError, errorText_(err), true);
      })
      .getRecordsByStatus(state.token, sheetKey, scope);
  }

  function renderRecords_(result, sheetKey, scope) {
    var headers = result.headers || [];
    els.recordsTableHead.innerHTML = '';
    headers.forEach(function (h) {
      var th = document.createElement('th'); th.textContent = h; els.recordsTableHead.appendChild(th);
    });
    // Restore action column (only meaningful when deleted rows are shown).
    var showRestore = (scope === 'deleted' || scope === 'all');
    if (showRestore) {
      var thAct = document.createElement('th'); thAct.textContent = ''; els.recordsTableHead.appendChild(thAct);
    }

    var statusIdx = headers.indexOf('Status');
    els.recordsTableBody.innerHTML = '';
    (result.rows || []).forEach(function (row) {
      var tr = document.createElement('tr');
      row.forEach(function (v) {
        var td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
      });
      if (showRestore) {
        var actTd = document.createElement('td');
        var isDeleted = statusIdx !== -1 && String(row[statusIdx] || '').toLowerCase() === 'deleted';
        if (isDeleted) {
          var btn = document.createElement('button');
          btn.type = 'button'; btn.className = 'btn btn-secondary btn-small';
          btn.textContent = 'Restore';
          btn.addEventListener('click', function () { onRestoreRecord_(sheetKey, row[0]); });
          actTd.appendChild(btn);
        }
        tr.appendChild(actTd);
      }
      els.recordsTableBody.appendChild(tr);
    });
    els.recordsCount.textContent = result.count + ' record(s)';
  }

  function onRestoreRecord_(sheetKey, idValue) {
    clearModalBanner_(els.recordsError);
    clearModalBanner_(els.recordsSuccess);
    google.script.run
      .withSuccessHandler(function (result) {
        if (result && result.success) { setModalBanner_(els.recordsSuccess, result.message, false); loadRecords_(); }
        else setModalBanner_(els.recordsError, (result && result.message) || 'Could not restore.', true);
      })
      .withFailureHandler(function (err) {
        if (isSessionError_(err)) { handleSessionExpired_(); return; }
        setModalBanner_(els.recordsError, errorText_(err), true);
      })
      .restoreDeletedRecord(state.token, sheetKey, idValue);
  }

  // =====================================================================
  // 2026-08 requirements pass (round 6) — Email Templates
  // =====================================================================

  function openEmailTemplatesModal_() {
    clearModalBanner_(els.emailTemplatesError);
    clearModalBanner_(els.emailTemplatesSuccess);
    show_(els.emailTemplatesModalOverlay);
    google.script.run
      .withSuccessHandler(function (config) {
        state.emailTemplatesConfig = config;
        els.etTemplateSelect.innerHTML = '';
        (config.keys || []).forEach(function (key) {
          var opt = document.createElement('option');
          opt.value = key;
          opt.textContent = templateKeyLabel_(key);
          els.etTemplateSelect.appendChild(opt);
        });
        els.etPlaceholderList.textContent = (config.placeholders || [])
          .map(function (p) { return '{{' + p + '}}'; }).join(', ');
        renderSelectedEmailTemplate_();
      })
      .withFailureHandler(function (err) {
        if (isSessionError_(err)) { handleSessionExpired_(); return; }
        setModalBanner_(els.emailTemplatesError, errorText_(err), true);
      })
      .getEmailTemplates(state.token);
  }

  /** Converts a camelCase template key into a readable label, e.g. "bookingConfirmation" -> "Booking Confirmation". */
  function templateKeyLabel_(key) {
    return key.replace(/([A-Z])/g, ' $1').replace(/^./, function (c) { return c.toUpperCase(); });
  }

  function renderSelectedEmailTemplate_() {
    var config = state.emailTemplatesConfig;
    if (!config) return;
    var key = els.etTemplateSelect.value;
    var t = (config.templates && config.templates[key]) || { subjectDe: '', bodyDe: '', subjectEn: '', bodyEn: '' };
    els.etSubjectDe.value = t.subjectDe || '';
    els.etSubjectEn.value = t.subjectEn || '';
    els.etBodyDe.value = t.bodyDe || '';
    els.etBodyEn.value = t.bodyEn || '';
  }

  function onSaveEmailTemplate_() {
    clearModalBanner_(els.emailTemplatesError);
    clearModalBanner_(els.emailTemplatesSuccess);
    var key = els.etTemplateSelect.value;
    var data = {
      subjectDe: els.etSubjectDe.value, subjectEn: els.etSubjectEn.value,
      bodyDe: els.etBodyDe.value, bodyEn: els.etBodyEn.value
    };
    google.script.run
      .withSuccessHandler(function (result) {
        if (result && result.success) {
          setModalBanner_(els.emailTemplatesSuccess, 'Template Saved \u2014 ' + templateKeyLabel_(key), false);
          if (state.emailTemplatesConfig && state.emailTemplatesConfig.templates) {
            state.emailTemplatesConfig.templates[key] = data;
          }
        } else {
          setModalBanner_(els.emailTemplatesError, (result && result.message) || 'Could not save template.', true);
        }
      })
      .withFailureHandler(function (err) {
        if (isSessionError_(err)) { handleSessionExpired_(); return; }
        setModalBanner_(els.emailTemplatesError, errorText_(err), true);
      })
      .updateEmailTemplate(state.token, key, data);
  }

  function onResetEmailTemplate_() {
    clearModalBanner_(els.emailTemplatesError);
    clearModalBanner_(els.emailTemplatesSuccess);
    var key = els.etTemplateSelect.value;
    if (!window.confirm('Reset "' + templateKeyLabel_(key) + '" to its default subject and body?')) return;
    google.script.run
      .withSuccessHandler(function (result) {
        if (result && result.success) {
          setModalBanner_(els.emailTemplatesSuccess, 'Template Reset \u2014 ' + templateKeyLabel_(key), false);
          openEmailTemplatesModal_();
        } else {
          setModalBanner_(els.emailTemplatesError, (result && result.message) || 'Could not reset template.', true);
        }
      })
      .withFailureHandler(function (err) {
        if (isSessionError_(err)) { handleSessionExpired_(); return; }
        setModalBanner_(els.emailTemplatesError, errorText_(err), true);
      })
      .resetEmailTemplate(state.token, key);
  }

  // =====================================================================
  // 2026-08 requirements pass (round 6) — Calendar Invitation Settings
  // =====================================================================

  function openCalendarInvitesModal_() {
    clearModalBanner_(els.calendarInvitesError);
    clearModalBanner_(els.calendarInvitesSuccess);
    show_(els.calendarInvitesModalOverlay);
    google.script.run
      .withSuccessHandler(function (config) {
        renderCalendarInvitesGrid_(config);
      })
      .withFailureHandler(function (err) {
        if (isSessionError_(err)) { handleSessionExpired_(); return; }
        setModalBanner_(els.calendarInvitesError, errorText_(err), true);
      })
      .getCalendarInviteSettings(state.token);
  }

  function renderCalendarInvitesGrid_(config) {
    state.calendarInvitesConfig = config;
    els.calendarInvitesGrid.innerHTML = '';
    (config.activities || []).forEach(function (activity) {
      var granted = (config.matrix && config.matrix[activity.key]) || [];
      var box = document.createElement('div');
      box.className = 'subform';
      box.style.marginBottom = '10px';
      var h = document.createElement('h4'); h.textContent = activity.label; box.appendChild(h);

      var checksWrap = document.createElement('div');
      checksWrap.style.display = 'flex';
      checksWrap.style.flexWrap = 'wrap';
      checksWrap.style.gap = '10px';
      (config.groups || []).forEach(function (grp) {
        var label = document.createElement('label');
        label.style.display = 'inline-flex';
        label.style.alignItems = 'center';
        label.style.gap = '4px';
        var cb = document.createElement('input');
        cb.type = 'checkbox'; cb.value = grp.key; cb.checked = granted.indexOf(grp.key) !== -1;
        label.appendChild(cb);
        label.appendChild(document.createTextNode(' ' + grp.label));
        checksWrap.appendChild(label);
      });
      box.appendChild(checksWrap);

      var saveBtn = document.createElement('button');
      saveBtn.type = 'button'; saveBtn.className = 'btn btn-primary btn-small';
      saveBtn.textContent = 'Save';
      saveBtn.style.marginTop = '8px';
      saveBtn.addEventListener('click', function () { onSaveCalendarInviteRouting_(activity.key, checksWrap); });
      box.appendChild(saveBtn);

      els.calendarInvitesGrid.appendChild(box);
    });
  }

  function onSaveCalendarInviteRouting_(activityKey, checksWrap) {
    clearModalBanner_(els.calendarInvitesError);
    clearModalBanner_(els.calendarInvitesSuccess);
    var groups = Array.prototype.slice.call(checksWrap.querySelectorAll('input[type=checkbox]:checked'))
      .map(function (cb) { return cb.value; });
    google.script.run
      .withSuccessHandler(function (result) {
        if (result && result.success) {
          setModalBanner_(els.calendarInvitesSuccess, result.message, false);
          if (state.calendarInvitesConfig && state.calendarInvitesConfig.matrix) {
            state.calendarInvitesConfig.matrix[activityKey] = groups;
          }
        } else {
          setModalBanner_(els.calendarInvitesError, (result && result.message) || 'Could not update routing.', true);
        }
      })
      .withFailureHandler(function (err) {
        if (isSessionError_(err)) { handleSessionExpired_(); return; }
        setModalBanner_(els.calendarInvitesError, errorText_(err), true);
      })
      .updateCalendarInviteRouting(state.token, activityKey, groups);
  }

  // =====================================================================
  // 2026-08 requirements pass (round 4) — Schedule Combinations (#3)
  // =====================================================================

  function openCombinationsModal_() {
    clearModalBanner_(els.combinationsError);
    clearModalBanner_(els.combinationsSuccess);
    els.combinationsFilter.value = '';
    els.combinationsTableBody.innerHTML = '';
    els.combinationsCount.textContent = '';
    show_(els.combinationsModalOverlay);
    loadCombinations_();
  }

  function loadCombinations_() {
    clearModalBanner_(els.combinationsError);
    clearModalBanner_(els.combinationsSuccess);
    els.combinationsCount.textContent = 'Loading\u2026';
    var availableOnly = els.combinationsScope.value !== 'all';
    google.script.run
      .withSuccessHandler(function (combos) {
        state.combinations = combos || [];
        renderCombinationsRows_();
      })
      .withFailureHandler(function (err) {
        els.combinationsCount.textContent = '';
        if (isSessionError_(err)) { handleSessionExpired_(); return; }
        setModalBanner_(els.combinationsError, errorText_(err), true);
      })
      .getCompatibleCombinations(state.token, availableOnly);
  }

  function renderCombinationsRows_() {
    var all = state.combinations || [];
    var filter = (els.combinationsFilter.value || '').trim().toLowerCase();
    var rows = filter ? all.filter(function (c) {
      return [c.day1SlotID, c.day1, c.day1StaffName, c.mriSlotID, c.mri, c.day2SlotID, c.day2, c.day2StaffName]
        .join(' ').toLowerCase().indexOf(filter) !== -1;
    }) : all;

    els.combinationsTableBody.innerHTML = '';
    rows.forEach(function (c, i) {
      var tr = document.createElement('tr');
      [String(i + 1),
       c.day1SlotID + ' — ' + c.day1,
       c.day1StaffName,
       (c.mriSlotID && c.mriSlotID !== '(none)') ? (c.mriSlotID + ' — ' + c.mri) : '—',
       c.day2SlotID + ' — ' + c.day2,
       c.day2StaffName
      ].forEach(function (v) {
        var td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
      });
      els.combinationsTableBody.appendChild(tr);
    });

    els.combinationsCount.textContent = filter
      ? (rows.length + ' of ' + all.length + ' combination(s) shown')
      : (all.length + ' combination(s)');
  }

  function onExportCombinationsPdf_() {
    clearModalBanner_(els.combinationsError);
    clearModalBanner_(els.combinationsSuccess);
    els.combinationsPdfBtn.disabled = true;
    els.combinationsPdfBtn.textContent = 'Generating\u2026';
    google.script.run
      .withSuccessHandler(function (result) {
        els.combinationsPdfBtn.disabled = false;
        els.combinationsPdfBtn.textContent = 'Export 3 PDFs (EN / DE / Any)';
        if (result && result.success && result.pdfs && result.pdfs.length) {
          // Stagger downloads slightly — browsers can drop near-simultaneous
          // programmatic multi-file downloads otherwise.
          result.pdfs.forEach(function (pdf, i) {
            setTimeout(function () { downloadBase64Pdf_(pdf.base64, pdf.fileName); }, i * 400);
          });
          var summary = result.pdfs.map(function (pdf) { return pdf.label + ': ' + pdf.count; }).join(', ');
          var msg = '3 PDFs generated (' + summary + '). Also saved to Drive where possible.';
          setModalBanner_(els.combinationsSuccess, msg, false);
        } else {
          setModalBanner_(els.combinationsError, (result && result.message) || 'Could not generate PDFs.', true);
        }
      })
      .withFailureHandler(function (err) {
        els.combinationsPdfBtn.disabled = false;
        els.combinationsPdfBtn.textContent = 'Export 3 PDFs (EN / DE / Any)';
        if (isSessionError_(err)) { handleSessionExpired_(); return; }
        setModalBanner_(els.combinationsError, errorText_(err), true);
      })
      .generateCombinationsPdfSet(state.token);
  }

  function downloadBase64Pdf_(base64, fileName) {
    try {
      var byteChars = atob(base64);
      var byteNumbers = new Array(byteChars.length);
      for (var i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
      var blob = new Blob([new Uint8Array(byteNumbers)], { type: 'application/pdf' });
      var link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = fileName || 'combinations.pdf';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(function () { URL.revokeObjectURL(link.href); }, 4000);
    } catch (e) {
      setModalBanner_(els.combinationsError, 'Could not trigger the download in this browser.', true);
    }
  }

  function show_(el) { if (el) el.classList.remove('hidden'); }
  function hide_(el) { if (el) el.classList.add('hidden'); }

  }); // closes the DOMContentLoaded callback opened at the top of this file (round 12 fix)

</script>
