<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap');

  :root {
    --ink: #0c2e36;
    --ink-soft: #3d5c64;
    --teal: #147a80;
    --teal-deep: #0d5c61;
    --teal-glow: rgba(20, 122, 128, 0.2);
    --border: rgba(12, 46, 54, 0.12);
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Outfit', system-ui, sans-serif;
    --nav-h: 64px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: var(--font-body);
    color: var(--ink);
    background: #eef6f7;
  }

  .hidden { display: none !important; }

  .project-id-banner {
    background: linear-gradient(90deg, #0c2e36, #147a80);
    color: #fff;
    text-align: center;
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 6px 12px;
  }

  .topnav {
    position: sticky;
    top: 0;
    z-index: 40;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 8px 24px rgba(12, 46, 54, 0.06);
  }

  .topnav-inner {
    max-width: 1200px;
    margin: 0 auto;
    min-height: var(--nav-h);
    padding: 0 16px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .topnav-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
    flex-shrink: 0;
  }

  .topnav-logo {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--teal), var(--teal-deep));
    box-shadow: 0 8px 18px var(--teal-glow);
  }

  .topnav-brand-text {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
  }
  .topnav-brand-text strong {
    font-family: var(--font-display);
    font-size: 15px;
  }
  .topnav-brand-text small {
    color: var(--ink-soft);
    font-size: 11px;
  }

  .topnav-links {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: 12px;
    flex: 1;
  }

  .topnav-link {
    text-decoration: none;
    color: var(--ink-soft);
    font-size: 14px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 999px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .topnav-link:hover { background: rgba(20, 122, 128, 0.08); color: var(--teal-deep); }
  .topnav-link.active {
    background: rgba(20, 122, 128, 0.12);
    color: var(--teal-deep);
  }

  .topnav-auth { margin-left: auto; display: flex; align-items: center; gap: 10px; }

  .topnav-user {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topnav-user-meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    line-height: 1.15;
  }
  .topnav-user-name { font-size: 13px; font-weight: 700; }
  .topnav-user-role { font-size: 11px; color: var(--ink-soft); }

  .btn-nav {
    border: none;
    border-radius: 999px;
    padding: 9px 16px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 650;
    cursor: pointer;
  }
  .btn-nav-primary {
    background: linear-gradient(135deg, var(--teal), var(--teal-deep));
    color: #fff;
    box-shadow: 0 8px 18px var(--teal-glow);
  }
  .btn-nav-ghost {
    background: #fff;
    border: 1px solid var(--border);
    color: var(--ink);
  }

  .topnav-toggle {
    display: none;
    margin-left: auto;
    width: 42px;
    height: 42px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #fff;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 5px;
    cursor: pointer;
  }
  .topnav-toggle span {
    display: block;
    width: 18px;
    height: 2px;
    background: var(--ink);
    border-radius: 2px;
  }

  .shell-main {
    height: calc(100vh - var(--nav-h));
    height: calc(100dvh - var(--nav-h));
  }
  body:has(.project-id-banner:not(.hidden)) .shell-main {
    height: calc(100vh - var(--nav-h) - 28px);
    height: calc(100dvh - var(--nav-h) - 28px);
  }

  .app-frame {
    width: 100%;
    height: 100%;
    border: 0;
    background: transparent;
    display: block;
  }

  .login-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(12, 46, 54, 0.48);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 60;
  }
  .login-modal {
    position: relative;
    width: min(400px, 100%);
    background: #fff;
    border-radius: 18px;
    padding: 28px 24px 24px;
    box-shadow: 0 24px 60px rgba(12, 46, 54, 0.28);
    border: 1px solid var(--border);
  }
  .login-modal-close {
    position: absolute;
    top: 10px;
    right: 12px;
    border: none;
    background: none;
    font-size: 24px;
    cursor: pointer;
    color: var(--ink-soft);
  }
  .login-modal-brand {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--teal-deep);
    margin-bottom: 8px;
  }
  .login-modal h2 {
    margin: 0 0 6px;
    font-family: var(--font-display);
    font-size: 1.5rem;
  }
  .login-modal-hint {
    margin: 0 0 16px;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block;
    font-size: 12.5px;
    font-weight: 650;
    margin-bottom: 6px;
  }
  .form-group input {
    width: 100%;
    padding: 11px 12px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font: inherit;
  }
  .form-group input:focus {
    outline: none;
    border-color: var(--teal);
    box-shadow: 0 0 0 4px var(--teal-glow);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    border: none;
    border-radius: 999px;
    padding: 12px 18px;
    font: inherit;
    font-weight: 650;
    cursor: pointer;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--teal), var(--teal-deep));
    color: #fff;
  }
  .banner {
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 12px;
    font-size: 13.5px;
  }
  .banner-error {
    background: #fff0f0;
    color: #b42318;
    border: 1px solid #f5c2c0;
  }
  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.45);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 820px) {
    .topnav-toggle { display: flex; }
    .topnav-links, .topnav-auth {
      display: none;
    }
    .topnav.open .topnav-links,
    .topnav.open .topnav-auth {
      display: flex;
    }
    .topnav.open .topnav-inner {
      flex-wrap: wrap;
      padding-bottom: 14px;
    }
    .topnav.open .topnav-links {
      order: 3;
      width: 100%;
      margin: 0;
      flex-direction: column;
      align-items: stretch;
    }
    .topnav.open .topnav-auth {
      order: 4;
      width: 100%;
      margin: 0;
      flex-direction: column;
      align-items: stretch;
    }
    .topnav.open .topnav-user {
      width: 100%;
      justify-content: space-between;
    }
    .topnav.open .topnav-user-meta { align-items: flex-start; }
    .btn-nav { width: 100%; }
  }
</style>
