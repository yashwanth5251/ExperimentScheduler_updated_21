<style>
  /* ==========================================================================
     Styles.html — Participant booking UI
     ========================================================================== */
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap');

  :root {
    --ink: #0c2e36;
    --ink-soft: #3d5c64;
    --teal: #147a80;
    --teal-deep: #0d5c61;
    --teal-glow: rgba(20, 122, 128, 0.18);
    --accent: #c97820;
    --accent-soft: #fff4e5;
    --mist: #e7f3f4;
    --surface: rgba(255, 255, 255, 0.88);
    --surface-solid: #ffffff;
    --border: rgba(12, 46, 54, 0.12);
    --success-bg: #e8f8f0;
    --success-text: #0f6b45;
    --error-bg: #fff0f0;
    --error-text: #b42318;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 10px 30px rgba(12, 46, 54, 0.08);
    --shadow-hover: 0 16px 40px rgba(12, 46, 54, 0.14);
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Outfit', system-ui, sans-serif;

    /* Back-compat aliases used elsewhere */
    --color-primary: var(--teal);
    --color-primary-dark: var(--teal-deep);
    --color-bg: var(--mist);
    --color-card: var(--surface-solid);
    --color-border: var(--border);
    --color-text: var(--ink);
    --color-text-muted: var(--ink-soft);
    --color-success-bg: var(--success-bg);
    --color-success-text: var(--success-text);
    --color-error-bg: var(--error-bg);
    --color-error-text: var(--error-text);
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.55;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(20, 122, 128, 0.22), transparent 55%),
      radial-gradient(900px 500px at 100% 0%, rgba(201, 120, 32, 0.14), transparent 50%),
      radial-gradient(800px 400px at 50% 100%, rgba(20, 122, 128, 0.10), transparent 45%),
      linear-gradient(180deg, #f4fbfb 0%, #eef6f7 45%, #f7fafb 100%);
    background-attachment: fixed;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.35;
    background-image:
      linear-gradient(rgba(12, 46, 54, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(12, 46, 54, 0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
  }

  .app-container {
    position: relative;
    z-index: 1;
    max-width: 820px;
    margin: 0 auto;
    padding: clamp(20px, 4vw, 40px) clamp(16px, 3vw, 24px) 72px;
    animation: riseIn 0.55s ease both;
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .project-id-banner {
    position: relative;
    z-index: 2;
    background: linear-gradient(90deg, #0c2e36, #147a80);
    color: #fff;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 8px 14px;
  }

  .app-header {
    text-align: center;
    margin-bottom: 28px;
    padding: 8px 0 4px;
  }

  .brand-mark {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    color: var(--teal-deep);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .brand-mark::before {
    content: '';
    width: 28px;
    height: 28px;
    border-radius: 9px;
    background:
      linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%);
    box-shadow: 0 8px 18px var(--teal-glow);
  }

  .app-header h1 {
    font-family: var(--font-display);
    font-size: clamp(1.75rem, 4.5vw, 2.35rem);
    margin: 0 0 8px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--ink);
    line-height: 1.15;
  }

  .subtitle {
    color: var(--ink-soft);
    margin: 0 auto;
    max-width: 36ch;
    font-size: 1rem;
    font-weight: 400;
  }

  #languageSection h2 {
    text-align: center;
    font-family: var(--font-display);
    font-size: 1.15rem;
    font-weight: 500;
    margin: 0 0 20px;
    color: var(--ink);
  }

  .language-options {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn-language {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 14px 28px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    font-family: inherit;
    min-width: 168px;
    justify-content: center;
    box-shadow: var(--shadow);
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .btn-language:hover {
    border-color: var(--teal);
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
  }

  .lang-flag {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--teal), var(--teal-deep));
    color: #fff;
    font-size: 11px;
    font-weight: 700;
  }

  .step-indicator {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .step {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink-soft);
    font-size: 13px;
    font-weight: 600;
    backdrop-filter: blur(8px);
    transition: all 0.25s ease;
  }

  .step-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(12, 46, 54, 0.08);
    color: var(--ink-soft);
    font-size: 12px;
  }

  .step.active {
    border-color: rgba(20, 122, 128, 0.45);
    color: var(--teal-deep);
    background: rgba(20, 122, 128, 0.08);
    box-shadow: 0 0 0 3px var(--teal-glow);
  }

  .step.active .step-num {
    background: var(--teal);
    color: #fff;
  }

  .step.done .step-num {
    background: var(--success-text);
    color: #fff;
  }

  .banner {
    padding: 14px 16px;
    border-radius: var(--radius-sm);
    margin-bottom: 18px;
    font-size: 14px;
    font-weight: 500;
    word-wrap: break-word;
    overflow-wrap: break-word;
    animation: fadeUp 0.3s ease both;
  }

  .banner-error {
    background: var(--error-bg);
    color: var(--error-text);
    border: 1px solid #f5c2c0;
  }

  .banner-success {
    background: var(--success-bg);
    color: var(--success-text);
    border: 1px solid #b7e4cb;
  }

  .hidden { display: none !important; }

  .section {
    background: var(--surface);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: clamp(18px, 3vw, 26px);
    margin-bottom: 18px;
    box-shadow: var(--shadow);
    animation: fadeUp 0.4s ease both;
  }

  .section h2 {
    font-family: var(--font-display);
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .section-hint {
    color: var(--ink-soft);
    font-size: 0.92rem;
    margin: 0 0 18px;
  }

  .loading, .empty-message {
    color: var(--ink-soft);
    font-size: 14px;
    padding: 12px 0;
  }

  .empty-message {
    background: var(--accent-soft);
    border: 1px solid #f0d4a8;
    color: #8a5310;
    border-radius: var(--radius-sm);
    padding: 12px 16px;
  }

  .slot-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    gap: 12px;
  }

  .slot-card {
    text-align: left;
    background: var(--surface-solid);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }

  .slot-card:hover {
    box-shadow: var(--shadow-hover);
    border-color: var(--teal);
    transform: translateY(-3px);
  }

  .slot-card.selected {
    border-color: var(--teal);
    background: linear-gradient(180deg, rgba(20, 122, 128, 0.10), #fff);
    box-shadow: 0 0 0 3px var(--teal-glow), var(--shadow);
  }

  .slot-date {
    font-weight: 650;
    font-size: 13.5px;
    margin-bottom: 4px;
    color: var(--ink);
  }

  .slot-time {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .slot-id {
    font-size: 11px;
    color: #8aa0a5;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .selection-summary {
    background: linear-gradient(180deg, rgba(20, 122, 128, 0.06), transparent);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    margin-bottom: 18px;
    font-size: 13.5px;
  }

  .summary-line { padding: 3px 0; }

  .form-group { margin-bottom: 16px; }

  label {
    display: block;
    font-size: 12.5px;
    font-weight: 650;
    margin-bottom: 7px;
    color: var(--ink);
    letter-spacing: 0.02em;
  }

  input[type="text"],
  input[type="email"],
  input[type="date"],
  input[type="time"],
  input[type="number"],
  input[type="password"],
  select,
  textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14.5px;
    font-family: inherit;
    background: #fff;
    color: var(--ink);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  select { appearance: auto; box-sizing: border-box; }
  textarea { resize: vertical; }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--teal);
    box-shadow: 0 0 0 4px var(--teal-glow);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: none;
    border-radius: 999px;
    padding: 13px 22px;
    font-size: 14.5px;
    font-weight: 650;
    cursor: pointer;
    font-family: inherit;
    width: 100%;
    transition: transform 0.15s ease, background 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%);
    color: #fff;
    box-shadow: 0 10px 24px var(--teal-glow);
  }

  .btn-primary:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 14px 28px rgba(20, 122, 128, 0.28);
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255, 255, 255, 0.45);
    border-top-color: #fff;
    border-radius: 50%;
    display: inline-block;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #confirmationPanel { text-align: center; }

  .confirmation-icon {
    width: 64px;
    height: 64px;
    line-height: 64px;
    border-radius: 50%;
    background: var(--success-bg);
    color: var(--success-text);
    font-size: 28px;
    font-weight: 700;
    margin: 0 auto 14px;
    box-shadow: 0 10px 24px rgba(15, 107, 69, 0.15);
    animation: riseIn 0.45s ease both;
  }

  .confirmation-details {
    text-align: left;
    max-width: 440px;
    margin: 18px auto;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    background: #fff;
  }

  .confirmation-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    font-size: 13.5px;
    border-bottom: 1px solid var(--border);
  }

  .confirmation-row:last-child { border-bottom: none; }
  .confirmation-label { color: var(--ink-soft); font-weight: 600; }
  .confirmation-value { text-align: right; font-weight: 500; }

  .confirmation-location {
    max-width: 440px;
    margin: 0 auto 18px;
    text-align: left;
    background: rgba(20, 122, 128, 0.06);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }

  .confirmation-location-heading {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }

  .confirmation-address { font-size: 14px; margin-bottom: 8px; }

  .maps-link {
    display: inline-block;
    font-size: 13.5px;
    font-weight: 650;
    color: var(--teal-deep);
    text-decoration: none;
  }
  .maps-link:hover { text-decoration: underline; }

  .confirmation-note { color: var(--ink-soft); font-size: 13px; }

  .credentials-box {
    background: linear-gradient(180deg, rgba(20, 122, 128, 0.10), rgba(20, 122, 128, 0.04));
    border: 1px solid rgba(20, 122, 128, 0.22);
    border-radius: var(--radius);
    padding: 16px;
    margin: 14px 0;
    font-size: 14.5px;
    line-height: 1.8;
  }

  @media (max-width: 640px) {
    .app-container { padding-bottom: 56px; }
    .step-label { display: none; }
    .slot-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .confirmation-row { flex-direction: column; gap: 2px; }
    .confirmation-value { text-align: left; }
    .btn-language { min-width: 140px; width: 100%; max-width: 280px; }
    .language-options { flex-direction: column; align-items: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
